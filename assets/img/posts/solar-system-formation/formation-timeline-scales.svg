<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Solar System formation timeline and scales</title>
  <desc id="desc">Schematic timeline from molecular cloud collapse to present Solar System, showing overlapping stages and approximate timescales.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#35556b"/>
    </marker>
    <style>
      .axis{stroke:#35556b;stroke-width:5;marker-end:url(#arrow)}
      .tick{stroke:#35556b;stroke-width:3}
      .box{fill:#f7f0dc;stroke:#b58a47;stroke-width:3}
      .text{font-family:Georgia,serif;font-size:22px;fill:#24313a}
      .small{font-family:Georgia,serif;font-size:16px;fill:#3b4750}
    </style>
  </defs>
  <rect width="980" height="520" fill="#f8f4ea"/>
  <text x="50" y="55" class="text">Solar System formation is staged, overlapping, and multiscale</text>
  <line x1="80" y1="300" x2="905" y2="300" class="axis"/>
  <g>
    <line x1="100" y1="285" x2="100" y2="315" class="tick"/>
    <text x="62" y="342" class="small">cloud</text>
    <rect x="45" y="110" width="125" height="72" rx="10" class="box"/>
    <text x="108" y="142" text-anchor="middle" class="small">molecular</text>
    <text x="108" y="164" text-anchor="middle" class="small">cloud</text>
  </g>
  <g>
    <line x1="250" y1="285" x2="250" y2="315" class="tick"/>
    <text x="210" y="342" class="small">collapse</text>
    <rect x="185" y="180" width="130" height="72" rx="10" class="box"/>
    <text x="250" y="212" text-anchor="middle" class="small">protostar</text>
    <text x="250" y="234" text-anchor="middle" class="small">+ disk</text>
  </g>
  <g>
    <line x1="390" y1="285" x2="390" y2="315" class="tick"/>
    <text x="354" y="342" class="small">CAIs</text>
    <rect x="325" y="92" width="130" height="72" rx="10" class="box"/>
    <text x="390" y="124" text-anchor="middle" class="small">oldest</text>
    <text x="390" y="146" text-anchor="middle" class="small">solids</text>
  </g>
  <g>
    <line x1="520" y1="285" x2="520" y2="315" class="tick"/>
    <text x="470" y="342" class="small">planetesimals</text>
    <rect x="455" y="180" width="130" height="72" rx="10" class="box"/>
    <text x="520" y="212" text-anchor="middle" class="small">pebbles to</text>
    <text x="520" y="234" text-anchor="middle" class="small">km bodies</text>
  </g>
  <g>
    <line x1="650" y1="285" x2="650" y2="315" class="tick"/>
    <text x="610" y="342" class="small">gas giants</text>
    <rect x="585" y="92" width="130" height="72" rx="10" class="box"/>
    <text x="650" y="124" text-anchor="middle" class="small">core + gas</text>
    <text x="650" y="146" text-anchor="middle" class="small">before disk loss</text>
  </g>
  <g>
    <line x1="780" y1="285" x2="780" y2="315" class="tick"/>
    <text x="720" y="342" class="small">terrestrial planets</text>
    <rect x="715" y="180" width="130" height="72" rx="10" class="box"/>
    <text x="780" y="212" text-anchor="middle" class="small">embryos</text>
    <text x="780" y="234" text-anchor="middle" class="small">+ impacts</text>
  </g>
  <g>
    <line x1="890" y1="285" x2="890" y2="315" class="tick"/>
    <text x="858" y="342" class="small">present</text>
    <rect x="825" y="92" width="120" height="72" rx="10" class="box"/>
    <text x="885" y="124" text-anchor="middle" class="small">cleared</text>
    <text x="885" y="146" text-anchor="middle" class="small">system</text>
  </g>
  <text x="70" y="430" class="small">Approximate anchors: CAIs about 4.567 Ga; gas disks typically disperse within a few Myr; terrestrial accretion can continue for tens of Myr.</text>
</svg>
