<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Free and forgetful adjunction</title>
  <desc id="desc">Raw generators become free structured lists, and forgetful functor returns carrier information.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Free / Forgetful Pattern</text>
    <rect x="110" y="135" width="250" height="145" rx="18" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="178" y="185" font-size="22">generators</text><text x="160" y="225" font-size="17">tokens, symbols, events</text>
    <rect x="560" y="135" width="250" height="145" rx="18" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="620" y="185" font-size="22">free structure</text><text x="616" y="225" font-size="17">lists as free monoids</text>
    <path d="M360 185 H560" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M560 235 H360" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="425" y="170" font-size="16">add minimal laws</text><text x="430" y="262" font-size="16">forget structure</text>
  </g>
</svg>
