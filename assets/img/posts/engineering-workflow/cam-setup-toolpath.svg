<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">CAM setup and toolpath logic</title><desc id="desc">Stock, fixture, datum, cutting tool, toolpath, and machine axes for CAM planning.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.stock{fill:#d8e4ef;stroke:#607c94;stroke-width:3}.part{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.tool{fill:#f1d8cc;stroke:#b45d47;stroke-width:3}.path{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><rect x="180" y="260" width="620" height="90" class="stock"/><rect x="350" y="210" width="280" height="140" rx="20" class="part"/><rect x="460" y="70" width="42" height="155" class="tool"/><polygon points="460,225 502,225 481,260" class="tool"/><path d="M250 190 C350 120 590 120 730 210" class="path"/><line x1="180" y1="350" x2="800" y2="350" stroke="#b45d47" stroke-width="5"/><text x="490" y="395" class="small">fixture/datum plane</text><text x="480" y="55" class="text">tool</text><text x="490" y="175" class="small">toolpath must respect reach, stock, fixture, collision, and machine limits</text></svg>
