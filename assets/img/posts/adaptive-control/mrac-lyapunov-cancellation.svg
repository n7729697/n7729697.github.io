<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">MRAC Lyapunov cancellation</title>
  <desc id="desc">Plant and reference model form tracking error used by adaptive law to cancel Lyapunov cross terms.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">MRAC Proof Mechanism</text>
    <rect x="95" y="125" width="170" height="80" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="142" y="172" font-size="17">plant</text>
    <rect x="95" y="250" width="170" height="80" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="126" y="297" font-size="17">reference model</text>
    <rect x="365" y="180" width="170" height="90" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="403" y="218" font-size="17">tracking error</text><text x="430" y="244" font-size="17">e</text>
    <rect x="635" y="180" width="190" height="90" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="672" y="218" font-size="17">adaptive law</text><text x="664" y="244" font-size="15">cancel cross terms</text>
    <path d="M265 165 L365 205" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M265 290 L365 245" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M535 225 H635" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M730 180 C650 95 260 92 180 125" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
