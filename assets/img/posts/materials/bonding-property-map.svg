<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Bonding property map</title>
  <desc id="desc">Map from metallic, ionic, covalent, and secondary bonding to common property tendencies.</desc>
  <style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.prop{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style>
  <rect width="980" height="520" fill="#f8f4ea"/>
  <rect x="70" y="95" width="180" height="95" rx="12" class="node"/><text x="160" y="130" class="text">metallic</text><text x="160" y="156" class="small">electron sea</text>
  <rect x="290" y="95" width="180" height="95" rx="12" class="node"/><text x="380" y="130" class="text">ionic</text><text x="380" y="156" class="small">charge attraction</text>
  <rect x="510" y="95" width="180" height="95" rx="12" class="node"/><text x="600" y="130" class="text">covalent</text><text x="600" y="156" class="small">directional sharing</text>
  <rect x="730" y="95" width="180" height="95" rx="12" class="node"/><text x="820" y="130" class="text">secondary</text><text x="820" y="156" class="small">dipoles, H bonds</text>
  <rect x="70" y="300" width="180" height="95" rx="12" class="prop"/><text x="160" y="333" class="text">conductive</text><text x="160" y="359" class="small">ductile possible</text>
  <rect x="290" y="300" width="180" height="95" rx="12" class="prop"/><text x="380" y="333" class="text">hard / brittle</text><text x="380" y="359" class="small">insulating often</text>
  <rect x="510" y="300" width="180" height="95" rx="12" class="prop"/><text x="600" y="333" class="text">stiff / high T</text><text x="600" y="359" class="small">semiconducting possible</text>
  <rect x="730" y="300" width="180" height="95" rx="12" class="prop"/><text x="820" y="333" class="text">chain mobility</text><text x="820" y="359" class="small">polymers, biology</text>
</svg>
