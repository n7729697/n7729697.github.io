<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Manufacturing process selection map</title>
  <desc id="desc">A decision map connecting product function, material compatibility, geometry, volume, quality capability, cost, and sustainability to process selection.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker>
  <style>.center{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.arrow{stroke:#45545e;stroke-width:3;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs>
  <rect width="980" height="560" fill="#f8f4ea"/>
  <rect x="365" y="230" width="250" height="100" rx="14" class="center"/><text x="490" y="270" class="text">process chain</text><text x="490" y="298" class="small">material + route + control</text>
  <rect x="70" y="70" width="190" height="80" rx="12" class="node"/><text x="165" y="103" class="text">function</text><text x="165" y="128" class="small">loads, life, environment</text>
  <rect x="395" y="55" width="190" height="80" rx="12" class="node"/><text x="490" y="88" class="text">material</text><text x="490" y="113" class="small">chemistry, state, feed</text>
  <rect x="720" y="70" width="190" height="80" rx="12" class="node"/><text x="815" y="103" class="text">geometry</text><text x="815" y="128" class="small">size, tolerance, features</text>
  <rect x="70" y="390" width="190" height="80" rx="12" class="node"/><text x="165" y="423" class="text">volume</text><text x="165" y="448" class="small">tooling vs flexibility</text>
  <rect x="395" y="410" width="190" height="80" rx="12" class="node"/><text x="490" y="443" class="text">quality</text><text x="490" y="468" class="small">capability, inspection</text>
  <rect x="720" y="390" width="190" height="80" rx="12" class="node"/><text x="815" y="423" class="text">cost + impact</text><text x="815" y="448" class="small">unit cost, energy, scrap</text>
  <path d="M220 150 C290 185 330 220 365 250" class="arrow"/><path d="M490 135 V225" class="arrow"/><path d="M760 150 C690 185 650 220 615 250" class="arrow"/><path d="M220 390 C290 355 330 325 365 305" class="arrow"/><path d="M490 410 V335" class="arrow"/><path d="M760 390 C690 355 650 325 615 305" class="arrow"/>
</svg>
