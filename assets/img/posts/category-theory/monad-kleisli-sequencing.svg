<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Monad and Kleisli sequencing</title>
  <desc id="desc">Effectful arrows compose with bind and return as identity.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Monads Sequence Contextual Computations</text>
    <circle cx="165" cy="205" r="44" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><circle cx="420" cy="205" r="44" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><circle cx="675" cy="205" r="44" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/>
    <text x="154" y="211" font-size="20">a</text><text x="409" y="211" font-size="20">m b</text><text x="664" y="211" font-size="20">m c</text>
    <path d="M210 205 H375" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M465 205 H630" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="255" y="185" font-size="17">f :: a -> m b</text><text x="505" y="185" font-size="17">g :: b -> m c</text>
    <text x="275" y="320" font-size="18">bind supplies the plumbing; laws make regrouping safe.</text>
  </g>
</svg>
