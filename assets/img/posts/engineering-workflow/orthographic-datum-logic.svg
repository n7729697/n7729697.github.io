<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Orthographic datum logic</title><desc id="desc">Orthographic drawing views with datum surfaces and dimensioning logic.</desc><style>.view{fill:#fff7e8;stroke:#b89057;stroke-width:3}.datum{stroke:#b45d47;stroke-width:5}.dim{stroke:#45545e;stroke-width:3;stroke-dasharray:7 6}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style><rect width="980" height="520" fill="#f8f4ea"/><rect x="140" y="160" width="210" height="150" class="view"/><rect x="400" y="160" width="210" height="150" class="view"/><rect x="660" y="160" width="210" height="150" class="view"/><line x1="140" y1="310" x2="350" y2="310" class="datum"/><line x1="400" y1="160" x2="400" y2="310" class="datum"/><line x1="660" y1="235" x2="870" y2="235" class="datum"/><text x="245" y="340" class="text">front view</text><text x="505" y="340" class="text">side view</text><text x="765" y="340" class="text">top view</text><text x="245" y="135" class="small">datum A</text><text x="505" y="135" class="small">datum B</text><text x="765" y="135" class="small">datum C</text><line x1="165" y1="120" x2="325" y2="120" class="dim"/><line x1="625" y1="180" x2="625" y2="295" class="dim"/><text x="490" y="430" class="small">Views define shape; datums define how the part is located, measured, assembled, and inspected.</text></svg>
