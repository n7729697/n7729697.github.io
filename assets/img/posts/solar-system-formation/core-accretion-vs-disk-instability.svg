<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Core accretion versus disk instability</title>
  <desc id="desc">Comparison of two giant planet formation mechanisms: bottom-up core accretion and top-down disk instability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#44545f"/>
    </marker>
    <style>
      .panel{fill:#fff7e8;stroke:#b89057;stroke-width:3}
      .disk{fill:none;stroke:#8aa9b0;stroke-width:16;opacity:.65}
      .core{fill:#9b6a4a;stroke:#553621;stroke-width:3}
      .gas{fill:#d6edf2;stroke:#5c8a96;stroke-width:3;opacity:.86}
      .arrow{stroke:#44545f;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .text{font-family:Georgia,serif;font-size:22px;fill:#24313a;text-anchor:middle}
      .small{font-family:Georgia,serif;font-size:16px;fill:#3b4750;text-anchor:middle}
    </style>
  </defs>
  <rect width="980" height="560" fill="#f8f4ea"/>
  <rect x="55" y="80" width="410" height="390" rx="14" class="panel"/>
  <rect x="515" y="80" width="410" height="390" rx="14" class="panel"/>
  <text x="260" y="125" class="text">core accretion</text>
  <text x="720" y="125" class="text">disk instability</text>
  <circle cx="150" cy="260" r="18" class="core"/>
  <circle cx="200" cy="260" r="28" class="core"/>
  <circle cx="275" cy="260" r="35" class="core"/>
  <circle cx="365" cy="260" r="58" class="gas"/>
  <circle cx="365" cy="260" r="22" class="core"/>
  <path d="M170 260 H190 M230 260 H255 M310 260 H335" class="arrow"/>
  <text x="260" y="360" class="small">solids build a core first;</text>
  <text x="260" y="383" class="small">gas accretion accelerates later</text>
  <ellipse cx="720" cy="255" rx="150" ry="62" class="disk"/>
  <path d="M610 250 C660 180 760 180 820 250 C760 230 680 230 610 250 Z" fill="#bad7df" stroke="#5c8a96" stroke-width="3"/>
  <circle cx="725" cy="250" r="48" class="gas"/>
  <path d="M665 205 C700 175 760 175 800 210" class="arrow"/>
  <text x="720" y="360" class="small">massive cold disk fragments;</text>
  <text x="720" y="383" class="small">fast but requires special conditions</text>
</svg>
