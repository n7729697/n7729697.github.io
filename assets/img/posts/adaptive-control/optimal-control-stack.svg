<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Optimal control stack</title>
  <desc id="desc">PMP, HJB, LQR, and MPC arranged by trajectory, value, analytic, and online constrained views.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Optimal Control Has Multiple Views</text>
    <rect x="95" y="115" width="165" height="170" rx="16" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="150" y="160" font-size="22">PMP</text><text x="122" y="205" font-size="15">trajectory conditions</text><text x="132" y="230" font-size="15">state + costate</text>
    <rect x="285" y="115" width="165" height="170" rx="16" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="340" y="160" font-size="22">HJB</text><text x="315" y="205" font-size="15">value function</text><text x="315" y="230" font-size="15">feedback view</text>
    <rect x="475" y="115" width="165" height="170" rx="16" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="532" y="160" font-size="22">LQR</text><text x="505" y="205" font-size="15">linear-quadratic</text><text x="510" y="230" font-size="15">Riccati solution</text>
    <rect x="665" y="115" width="165" height="170" rx="16" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="738" y="160" font-size="22">MPC</text><text x="695" y="205" font-size="15">online horizon</text><text x="700" y="230" font-size="15">constraints</text>
  </g>
</svg>
