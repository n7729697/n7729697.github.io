<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Dynamic programming state transition</title><desc id="desc">Dynamic programming table with base cases, transitions, fill order, and answer extraction.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.cell{fill:#fff7e8;stroke:#b89057;stroke-width:2}.base{fill:#dcebdc;stroke:#5f7c57;stroke-width:2}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><g transform="translate(250,120)"><rect width="80" height="60" class="base"/><rect x="80" width="80" height="60" class="base"/><rect x="160" width="80" height="60" class="base"/><rect y="60" width="80" height="60" class="base"/><rect x="80" y="60" width="80" height="60" class="cell"/><rect x="160" y="60" width="80" height="60" class="cell"/><rect y="120" width="80" height="60" class="base"/><rect x="80" y="120" width="80" height="60" class="cell"/><rect x="160" y="120" width="80" height="60" class="cell"/></g><path d="M370 210 H440" class="arrow"/><path d="M330 250 C400 300 470 315 550 300" class="arrow"/><rect x="560" y="240" width="170" height="80" rx="12" class="base"/><text x="645" y="285" class="text">answer state</text><text x="490" y="410" class="small">Define states, base cases, recurrence, and fill order before coding.</text></svg>
