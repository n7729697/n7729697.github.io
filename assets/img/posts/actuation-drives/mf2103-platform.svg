<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">MF2103 embedded motor-control platform</title>
  <desc id="desc">Block diagram of the STM32L476RG Nucleo board with its timers and pins, the DC motor control shield, the coreless DC motor with encoder, the W5500 Ethernet shield over SPI3, and the debug connection.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="1000" height="470" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>MF2103 platform: what is wired to what</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>pins and peripherals from the CubeMX .ioc and peripherals.c; driver-shield part number not documented</tspan></text>
    <rect x="330" y="95" width="330" height="300" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="495" y="120" font-size="14" text-anchor="middle" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Nucleo-L476RG (Cortex-M4F, 40 MHz)</tspan></text>
    <text x="345" y="150" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">TIM3 CH1 → PB4</text>
    <text x="545" y="150" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">PWM, CW</text>
    <text x="345" y="184" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">TIM3 CH2 → PA7</text>
    <text x="545" y="184" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">PWM, CCW</text>
    <text x="345" y="218" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">PA5, PA6 (GPIO)</text>
    <text x="545" y="218" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">bridge enables</text>
    <text x="345" y="252" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">TIM1 CH1/2 ← PA8/9</text>
    <text x="545" y="252" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">encoder, 16 bit</text>
    <text x="345" y="286" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">SPI3 PC10-12, PB6</text>
    <text x="545" y="286" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">W5500</text>
    <text x="345" y="320" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">SysTick 1 ms</text>
    <text x="545" y="320" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">tick / os_time</text>
    <text x="345" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">SWD, SWO (PB3)</text>
    <text x="545" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">debug, ITM</text>
    <rect x="40" y="95" width="230" height="110" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="155.0" y="138.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">PC: Keil MDK + CubeMX</text>
    <text x="155.0" y="154.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">watch, logic analyzer,</text>
    <text x="155.0" y="170.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">event viewer (RTX)</text>
    <line x1="270" y1="150" x2="330" y2="150" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="300.0" y="142.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>USB / ST-LINK</tspan></text>
    <rect x="720" y="95" width="250" height="90" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="845.0" y="128.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>DC motor control shield</tspan></text>
    <text x="845.0" y="144.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>(dual half-bridge, part n/a)</tspan></text>
    <text x="845.0" y="160.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>motor supply not documented</tspan></text>
    <rect x="720" y="225" width="250" height="80" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="845.0" y="253.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>Assun AM-CL1643MB-1210</tspan></text>
    <text x="845.0" y="269.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>coreless brushed DC, 12 V</tspan></text>
    <text x="845.0" y="285.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>+ incremental encoder</tspan></text>
    <rect x="720" y="335" width="250" height="60" rx="8" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="845.0" y="361.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>W5500 Ethernet shield</tspan></text>
    <text x="845.0" y="377.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>→ second Nucleo (server)</tspan></text>
    <line x1="660" y1="165" x2="720" y2="150" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="845" y1="185" x2="845" y2="225" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="885.0" y="197.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>motor A/B</tspan></text>
    <path d="M 720 280 L 690 280 L 690 260 L 660 260" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="690" y="300" font-size="11" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>A/B quadrature → PA8/PA9</tspan></text>
    <line x1="660" y1="365" x2="720" y2="365" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="690.0" y="357.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>SPI3</tspan></text>
    <text x="40" y="425" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">PWM: f = 40 MHz / (ARR + 1) = 40 MHz / 2001 ≈ 19.99 kHz with 2001 duty steps (≈ 11 bit).</text>
    <text x="40" y="445" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">Encoder: 2048 counts/rev is assumed by the firmware and not documented.   PA5 also drives the user LED LD2.</text>
  </g>
</svg>
