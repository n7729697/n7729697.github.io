<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Exponential and logarithm plus minus</title>
  <desc id="desc">Manifold pose updated by tangent perturbation through exponential and residual through logarithm.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Optimize Locally, Update on the Manifold</text>
    <ellipse cx="430" cy="245" rx="280" ry="90" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <circle cx="335" cy="235" r="10" fill="#8b5849"/><circle cx="560" cy="210" r="10" fill="#4e6f52"/>
    <line x1="335" y1="235" x2="500" y2="160" stroke="#806632" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="505" y="158" font-size="16">tangent increment tau</text>
    <path d="M345 235 C420 195 500 190 560 210" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="425" y="300" font-size="17">x plus tau = x exp(tau)</text>
    <text x="425" y="330" font-size="17">x2 minus x1 = log(x1^-1 x2)</text>
  </g>
</svg>
