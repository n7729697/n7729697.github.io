<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Push and pull control</title><desc id="desc">Push releases work from plan; pull releases work from downstream consumption and WIP signal.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.pull{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.signal{stroke:#b45d47;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-dasharray:8 7}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="500" fill="#f8f4ea"/><text x="250" y="75" class="text">push</text><rect x="80" y="120" width="140" height="70" rx="10" class="node"/><text x="150" y="162" class="text">plan</text><rect x="300" y="120" width="140" height="70" rx="10" class="node"/><text x="370" y="162" class="text">release</text><path d="M220 155 H300" class="arrow"/><text x="720" y="75" class="text">pull</text><rect x="580" y="120" width="140" height="70" rx="10" class="pull"/><text x="650" y="162" class="text">consume</text><rect x="780" y="120" width="140" height="70" rx="10" class="pull"/><text x="850" y="162" class="text">authorize</text><path d="M850 190 C820 260 680 260 650 190" class="signal"/><text x="735" y="285" class="small">kanban/WIP signal</text><text x="490" y="405" class="small">Push coordinates future demand; pull controls execution by limiting WIP.</text></svg>
