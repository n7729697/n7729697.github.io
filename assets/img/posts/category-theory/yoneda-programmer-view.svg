<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Yoneda programmer view</title>
  <desc id="desc">A value in F a corresponds to polymorphic mapping behavior from a to x into F x.</desc>
  <rect width="920" height="420" fill="#f8f5ed"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Yoneda: Behavior Determines Data</text>
    <rect x="95" y="145" width="230" height="115" rx="16" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="165" y="196" font-size="22">F a</text><text x="130" y="226" font-size="16">a value in context</text>
    <path d="M325 202 H560" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M560 222 H325" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="575" y="145" width="260" height="115" rx="16" fill="#e7dff0" stroke="#64527b" stroke-width="2"/>
    <text x="615" y="196" font-size="20">forall x. (a -> x) -> F x</text>
    <text x="618" y="226" font-size="16">polymorphic mapper</text>
    <text x="245" y="330" font-size="15" fill="#5f625c">Naturality prevents type-specific tricks, so the polymorphic behavior collapses to structure already present.</text>
  </g>
</svg>
