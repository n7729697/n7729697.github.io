<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Lie group and algebra robotics map</title>
  <desc id="desc">SE3 poses and se3 twists connected by exponential and logarithm maps.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Global Pose, Local Increment</text>
    <ellipse cx="290" cy="220" rx="180" ry="95" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="230" y="218" font-size="23">SE(3) pose</text><text x="220" y="248" font-size="16">finite rigid motion</text>
    <rect x="600" y="145" width="210" height="150" rx="18" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="665" y="205" font-size="23">se(3)</text><text x="642" y="235" font-size="16">twist / perturbation</text>
    <path d="M470 190 H600" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 250 H470" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="505" y="176" font-size="16">log</text><text x="505" y="278" font-size="16">exp</text>
  </g>
</svg>
