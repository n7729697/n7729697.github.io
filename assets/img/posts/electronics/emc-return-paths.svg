<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">EMC return paths</title>
  <desc id="desc">PCB return path discontinuity, loop area, and common-mode cable current.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">EMC Is Current Path Discipline</text>
    <rect x="95" y="115" width="475" height="210" rx="18" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <rect x="130" y="255" width="405" height="35" fill="#b8c8cf"/>
    <path d="M140 160 C230 110 350 115 515 155" fill="none" stroke="#8b5849" stroke-width="4"/>
    <path d="M515 260 C350 310 230 305 140 260" fill="none" stroke="#4e6f52" stroke-width="4"/>
    <rect x="310" y="245" width="65" height="55" fill="#f8f4ec" stroke="#9b5847" stroke-width="2"/>
    <text x="285" y="334" font-size="14">return discontinuity</text>
    <line x1="570" y1="205" x2="800" y2="205" stroke="#4c5854" stroke-width="10"/>
    <path d="M610 175 C690 130 770 145 820 190" fill="none" stroke="#9b5847" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="612" y="255" font-size="16">common-mode cable current</text>
    <text x="118" y="378" font-size="15" fill="#5f625c">Reduce loop area, preserve return continuity, damp fast edges, and bond shields intentionally.</text>
  </g>
</svg>
