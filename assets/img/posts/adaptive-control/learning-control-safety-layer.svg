<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Learning control safety layer</title>
  <desc id="desc">Learning planner filtered by safety layer before reaching low-level controller and plant.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Learning Inside a Safety Architecture</text>
    <rect x="70" y="165" width="155" height="82" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="103" y="212" font-size="17">RL / planner</text>
    <rect x="285" y="165" width="155" height="82" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="323" y="199" font-size="17">safety filter</text><text x="325" y="224" font-size="14">CBF / MPC</text>
    <rect x="500" y="165" width="155" height="82" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="527" y="212" font-size="17">stabilizer</text>
    <rect x="715" y="165" width="155" height="82" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="766" y="212" font-size="17">plant</text>
    <path d="M225 206 H285" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 206 H500" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 206 H715" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M792 247 C640 340 260 340 150 247" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
