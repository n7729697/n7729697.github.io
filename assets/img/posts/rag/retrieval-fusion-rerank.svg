<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval fusion and reranking</title>
  <desc id="desc">Dense and sparse retrieval feed fusion, filtering, reranking, and final context.</desc>
  <rect width="920" height="420" fill="#f8f5ed"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Recall First, Precision Second</text>
    <rect x="70" y="125" width="150" height="76" rx="12" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="105" y="168" font-size="16">dense search</text>
    <rect x="70" y="230" width="150" height="76" rx="12" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="104" y="273" font-size="16">sparse search</text>
    <rect x="320" y="175" width="145" height="86" rx="12" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="366" y="212" font-size="16">fusion</text><text x="350" y="235" font-size="15">dedupe/filter</text>
    <rect x="555" y="175" width="145" height="86" rx="12" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="588" y="224" font-size="16">reranker</text>
    <rect x="775" y="175" width="100" height="86" rx="12" fill="#e7dff0" stroke="#64527b" stroke-width="2"/><text x="796" y="224" font-size="16">context</text>
    <path d="M220 163 L320 204" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 268 L320 232" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M465 218 H555" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 218 H775" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
