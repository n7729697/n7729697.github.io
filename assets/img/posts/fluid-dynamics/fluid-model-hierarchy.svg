<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Fluid model hierarchy</title><desc id="desc">Fluid mechanics model hierarchy from conservation laws to simplified models and CFD.</desc><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.text{font-family:Georgia,serif;font-size:19px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:14px;fill:#3b4750;text-anchor:middle}</style><rect width="980" height="520" fill="#f8f4ea"/><rect x="370" y="60" width="240" height="75" rx="12" class="core"/><text x="490" y="105" class="text">conservation laws</text><rect x="80" y="220" width="180" height="80" rx="12" class="node"/><text x="170" y="252" class="text">Bernoulli</text><text x="170" y="276" class="small">inviscid energy</text><rect x="300" y="220" width="180" height="80" rx="12" class="node"/><text x="390" y="252" class="text">pipe losses</text><text x="390" y="276" class="small">viscous internal</text><rect x="520" y="220" width="180" height="80" rx="12" class="node"/><text x="610" y="252" class="text">boundary layer</text><text x="610" y="276" class="small">wall viscosity</text><rect x="740" y="220" width="180" height="80" rx="12" class="node"/><text x="830" y="252" class="text">compressible</text><text x="830" y="276" class="small">waves/shocks</text><rect x="400" y="380" width="180" height="80" rx="12" class="core"/><text x="490" y="412" class="text">CFD</text><text x="490" y="436" class="small">when fields matter</text></svg>
