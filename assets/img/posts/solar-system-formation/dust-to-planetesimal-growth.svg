<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Dust to planetesimal growth mechanisms</title>
  <desc id="desc">Flow diagram showing growth from dust grains to pebbles, drift and fragmentation barriers, concentration by streaming instability, and gravitational collapse into planetesimals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3f5d69"/>
    </marker>
    <style>
      .box{fill:#fff7e7;stroke:#b88b4f;stroke-width:3}
      .warn{fill:#f3ddd1;stroke:#b35a44;stroke-width:3}
      .good{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}
      .arrow{stroke:#3f5d69;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .text{font-family:Georgia,serif;font-size:21px;fill:#24313a;text-anchor:middle}
      .small{font-family:Georgia,serif;font-size:16px;fill:#3b4750;text-anchor:middle}
    </style>
  </defs>
  <rect width="980" height="560" fill="#f8f4ea"/>
  <rect x="45" y="210" width="150" height="90" rx="12" class="box"/>
  <text x="120" y="245" class="text">dust</text>
  <text x="120" y="272" class="small">micron grains</text>
  <path d="M195 255 H270" class="arrow"/>
  <rect x="275" y="210" width="150" height="90" rx="12" class="box"/>
  <text x="350" y="245" class="text">aggregates</text>
  <text x="350" y="272" class="small">sticking works</text>
  <path d="M425 255 H500" class="arrow"/>
  <rect x="505" y="210" width="150" height="90" rx="12" class="warn"/>
  <text x="580" y="238" class="text">barriers</text>
  <text x="580" y="265" class="small">drift, bouncing,</text>
  <text x="580" y="286" class="small">fragmentation</text>
  <path d="M580 300 C580 355 645 380 700 380" class="arrow"/>
  <rect x="700" y="335" width="190" height="90" rx="12" class="good"/>
  <text x="795" y="370" class="text">concentration</text>
  <text x="795" y="397" class="small">streaming instability</text>
  <path d="M795 335 C795 285 770 260 660 255" class="arrow"/>
  <rect x="720" y="210" width="190" height="90" rx="12" class="good"/>
  <text x="815" y="245" class="text">planetesimals</text>
  <text x="815" y="272" class="small">gravity takes over</text>
  <text x="490" y="85" class="text">The hard transition is not dust to pebble, but pebble to gravitationally bound body.</text>
  <circle cx="95" cy="350" r="5" fill="#6e563e"/>
  <circle cx="125" cy="360" r="4" fill="#6e563e"/>
  <circle cx="150" cy="345" r="6" fill="#6e563e"/>
  <circle cx="795" cy="485" r="22" fill="#7f6b55"/>
  <circle cx="845" cy="470" r="13" fill="#7f6b55"/>
  <circle cx="755" cy="468" r="10" fill="#7f6b55"/>
</svg>
