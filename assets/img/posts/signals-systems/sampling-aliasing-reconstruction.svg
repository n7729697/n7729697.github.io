<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Sampling, aliasing, and reconstruction</title>
  <desc id="desc">Frequency replicas from sampling and anti-alias filtering.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#25312f">
    <text x="50" y="56" font-size="26" font-weight="700">Sampling in the Frequency Domain</text>
    <line x1="80" y1="300" x2="840" y2="300" stroke="#4c5854" stroke-width="2"/>
    <path d="M420 300 C455 155 505 155 540 300" fill="#d8e8ef" stroke="#426a7a" stroke-width="3"/>
    <path d="M215 300 C250 155 300 155 335 300" fill="#ead0c8" stroke="#8b5849" stroke-width="3" opacity=".75"/>
    <path d="M625 300 C660 155 710 155 745 300" fill="#ead0c8" stroke="#8b5849" stroke-width="3" opacity=".75"/>
    <line x1="480" y1="125" x2="480" y2="320" stroke="#806632" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="275" y1="125" x2="275" y2="320" stroke="#806632" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="685" y1="125" x2="685" y2="320" stroke="#806632" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="463" y="330" font-size="15">0</text><text x="245" y="330" font-size="15">-fs</text><text x="674" y="330" font-size="15">+fs</text>
    <rect x="405" y="130" width="150" height="190" fill="none" stroke="#3e6b54" stroke-width="3"/>
    <text x="332" y="104" font-size="15">anti-alias filter keeps one non-overlapping band</text>
  </g>
</svg>
