<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">STM32L476 memory map and RAM layout</title>
  <desc id="desc">The Cortex-M4 address space with code flash, SRAM2, SRAM1, peripherals and the private peripheral bus, the addresses of the timers and GPIO used in the project, and how the linker places text, data, bss, heap and stack.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="980" height="520" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>One address space: memory, peripherals and the core</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>a peripheral register is just an address; volatile tells the compiler that reading it has side effects</tspan></text>
    <text x="40" y="118" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0xE000 0000</text>
    <rect x="150" y="90" width="330" height="40" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="315.0" y="114.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">Private peripheral bus: NVIC, SysTick, SCB, DWT</text>
    <text x="40" y="166" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x4800 0000</text>
    <rect x="150" y="138" width="330" height="40" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="315.0" y="162.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">AHB2: GPIOA 0x4800 0000, GPIOC 0x4800 0800</text>
    <text x="40" y="214" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x4001 2C00</text>
    <rect x="150" y="186" width="330" height="40" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="315.0" y="210.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">APB2: TIM1 (encoder)</text>
    <text x="40" y="262" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x4000 0400</text>
    <rect x="150" y="234" width="330" height="40" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="315.0" y="258.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">APB1: TIM3 (PWM)</text>
    <text x="40" y="310" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x2000 0000</text>
    <rect x="150" y="282" width="330" height="40" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="315.0" y="306.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">SRAM1, 96 KB</text>
    <text x="40" y="358" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x1000 0000</text>
    <rect x="150" y="330" width="330" height="40" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="315.0" y="354.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">SRAM2, 32 KB</text>
    <text x="40" y="406" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x0800 0000</text>
    <rect x="150" y="378" width="330" height="40" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="315.0" y="402.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">Flash, 1 MB (code, constants)</text>
    <text x="40" y="454" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre">0x0000 0000</text>
    <rect x="150" y="426" width="330" height="40" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="315.0" y="450.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">boot alias (flash / system / SRAM)</text>
    <rect x="560" y="90" width="380" height="360" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="750" y="115" font-size="14" text-anchor="middle" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>RAM (SRAM1) as the linker fills it</tspan></text>
    <rect x="580" y="130" width="340" height="48" rx="8" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/>
    <text x="750.0" y="158.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">stack (MSP) ↓  grows down from top</text>
    <rect x="580" y="190" width="340" height="48" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="750.0" y="218.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">free RAM (stack overflow lands here)</text>
    <rect x="580" y="250" width="340" height="48" rx="8" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="750.0" y="278.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">heap ↑ (malloc; avoid at run time)</text>
    <rect x="580" y="310" width="340" height="48" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="750.0" y="338.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">.bss  zero-initialized globals</text>
    <rect x="580" y="370" width="340" height="48" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="750.0" y="398.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">.data  initialized globals (copied from flash)</text>
    <text x="580" y="445" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre">RTOS: each thread gets its own stack block inside .bss</text>
  </g>
</svg>
