<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Ashby selection logic</title>
  <desc id="desc">Material selection map using a performance index first, then filtering by processing, environment, cost, joining, inspection, and sustainability.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs>
  <rect width="980" height="540" fill="#f8f4ea"/>
  <rect x="80" y="220" width="180" height="90" rx="12" class="node"/><text x="170" y="255" class="text">mechanics</text><text x="170" y="282" class="small">derive index M</text>
  <rect x="335" y="220" width="180" height="90" rx="12" class="core"/><text x="425" y="255" class="text">screen</text><text x="425" y="282" class="small">E, σ, ρ charts</text>
  <rect x="590" y="110" width="260" height="80" rx="12" class="node"/><text x="720" y="143" class="text">constraints</text><text x="720" y="168" class="small">corrosion, cost, joining</text>
  <rect x="590" y="330" width="260" height="80" rx="12" class="node"/><text x="720" y="363" class="text">final pair</text><text x="720" y="388" class="small">material + process + inspection</text>
  <path d="M260 265 H335" class="arrow"/><path d="M515 250 C570 220 610 190 640 180" class="arrow"/><path d="M720 190 V330" class="arrow"/><path d="M515 280 C570 310 610 340 640 350" class="arrow"/>
</svg>
