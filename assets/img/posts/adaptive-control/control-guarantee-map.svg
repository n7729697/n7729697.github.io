<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Advanced control guarantee map</title>
  <desc id="desc">Comparison of adaptive, optimal, robust, and learning control by uncertainty and guarantee.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Choose Control Method by Guarantee</text>
    <line x1="110" y1="315" x2="820" y2="315" stroke="#4c5854" stroke-width="2"/>
    <line x1="130" y1="335" x2="130" y2="95" stroke="#4c5854" stroke-width="2"/>
    <text x="600" y="350" font-size="15">model uncertainty / data dependence</text>
    <text x="28" y="112" font-size="15">guarantee strength</text>
    <circle cx="250" cy="180" r="48" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="210" y="186" font-size="17">adaptive</text>
    <circle cx="410" cy="215" r="48" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="377" y="221" font-size="17">optimal</text>
    <circle cx="560" cy="155" r="48" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="528" y="161" font-size="17">robust</text>
    <circle cx="705" cy="255" r="48" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="672" y="261" font-size="17">learning</text>
  </g>
</svg>
