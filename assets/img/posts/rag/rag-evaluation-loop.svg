<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">RAG evaluation loop</title>
  <desc id="desc">Evaluation loop for retrieval, generation, citations, latency, cost, and index freshness.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Evaluate Each Stage Separately</text>
    <circle cx="460" cy="215" r="125" fill="#eef0dc" stroke="#806632" stroke-width="2"/>
    <text x="398" y="130" font-size="17">retrieval recall</text><text x="555" y="202" font-size="17">faithfulness</text><text x="410" y="315" font-size="17">citations</text><text x="285" y="205" font-size="17">latency/cost</text>
    <path d="M460 90 C610 95 690 190 620 300" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M610 310 C490 385 310 325 335 185" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M330 175 C355 95 405 85 460 90" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="265" y="380" font-size="15" fill="#5f625c">Failures should update tests, prompts, retrievers, metadata, and source documents.</text>
  </g>
</svg>
