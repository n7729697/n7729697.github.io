<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc"><title id="title">Fluid regime map</title><desc id="desc">Reynolds and Mach number regime map.</desc><style>.axis{stroke:#3f5663;stroke-width:4}.zone1{fill:#dcebdc;opacity:.75}.zone2{fill:#fff0ca;opacity:.75}.zone3{fill:#f1d8cc;opacity:.75}.line{stroke:#3f5663;stroke-width:3;stroke-dasharray:8 7}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750}</style><rect width="980" height="540" fill="#f8f4ea"/><line x1="110" y1="430" x2="860" y2="430" class="axis"/><line x1="110" y1="430" x2="110" y2="90" class="axis"/><rect x="110" y="90" width="300" height="340" class="zone1"/><rect x="410" y="90" width="250" height="340" class="zone2"/><rect x="660" y="90" width="200" height="340" class="zone3"/><line x1="110" y1="245" x2="860" y2="245" class="line"/><text x="190" y="160" class="text">low Re</text><text x="455" y="160" class="text">inertial</text><text x="700" y="160" class="text">compressible</text><text x="665" y="470" class="small">Reynolds number</text><text x="35" y="125" class="small">Mach number</text><text x="125" y="235" class="small">Ma ≈ 0.3</text></svg>
