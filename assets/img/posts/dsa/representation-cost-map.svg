<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Representation cost map</title><desc id="desc">Map of data structures and their cheap operations.</desc><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style><rect width="980" height="520" fill="#f8f4ea"/><rect x="80" y="110" width="180" height="90" rx="12" class="core"/><text x="170" y="145" class="text">array</text><text x="170" y="170" class="small">index + locality</text><rect x="400" y="110" width="180" height="90" rx="12" class="node"/><text x="490" y="145" class="text">hash table</text><text x="490" y="170" class="small">expected lookup</text><rect x="720" y="110" width="180" height="90" rx="12" class="node"/><text x="810" y="145" class="text">tree</text><text x="810" y="170" class="small">ordered queries</text><rect x="235" y="315" width="180" height="90" rx="12" class="node"/><text x="325" y="350" class="text">linked list</text><text x="325" y="375" class="small">local insertion</text><rect x="565" y="315" width="180" height="90" rx="12" class="node"/><text x="655" y="350" class="text">heap</text><text x="655" y="375" class="small">priority access</text></svg>
