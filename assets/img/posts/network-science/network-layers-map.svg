<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Network science layers map</title>
  <desc id="desc">Topology, dynamics, inference, temporal structure, and control applications connected as network science layers.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="52" y="58" font-size="26" font-weight="700">Network Science: Structure Becomes Mechanism</text>
    <g font-size="16">
      <rect x="70" y="140" width="140" height="78" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="108" y="174">topology</text><text x="104" y="197">A, L, paths</text>
      <rect x="265" y="140" width="140" height="78" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="301" y="174">dynamics</text><text x="290" y="197">spread, flow</text>
      <rect x="460" y="140" width="140" height="78" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="497" y="174">inference</text><text x="482" y="197">blocks, evidence</text>
      <rect x="655" y="140" width="140" height="78" rx="14" fill="#e7dff0" stroke="#64527b" stroke-width="2"/><text x="693" y="174">control</text><text x="676" y="197">intervene, route</text>
    </g>
    <path d="M210 179 H265" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M405 179 H460" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 179 H655" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M725 220 C610 305 250 305 140 220" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="150" y="330" font-size="15" fill="#5f625c">The same graph can be a measurement object, a dynamical substrate, and a control constraint.</text>
  </g>
</svg>
