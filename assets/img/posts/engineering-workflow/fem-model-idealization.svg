<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">FEM model idealization</title><desc id="desc">FEM workflow from CAD simplification to mesh, loads, constraints, solution, and validation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.mesh{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:18px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:14px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><rect x="60" y="210" width="130" height="75" rx="10" class="node"/><text x="125" y="254" class="text">CAD</text><rect x="250" y="210" width="150" height="75" rx="10" class="node"/><text x="325" y="254" class="text">idealize</text><rect x="460" y="190" width="150" height="115" rx="10" class="mesh"/><text x="535" y="235" class="text">mesh</text><text x="535" y="262" class="small">elements/nodes</text><rect x="670" y="210" width="130" height="75" rx="10" class="node"/><text x="735" y="254" class="text">solve</text><rect x="835" y="210" width="110" height="75" rx="10" class="node"/><text x="890" y="254" class="text">validate</text><path d="M190 248 H250" class="arrow"/><path d="M400 248 H460" class="arrow"/><path d="M610 248 H670" class="arrow"/><path d="M800 248 H835" class="arrow"/><text x="535" y="365" class="small">Loads, constraints, contacts, materials, and mesh convergence often dominate error.</text></svg>
