<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Biology model building flow</title>
  <desc id="desc">Question, state variables, processes, equations, analysis, simulation, and interpretation.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Build the Model from Biology First</text>
    <g font-size="15">
      <rect x="60" y="150" width="125" height="76" rx="12" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="90" y="194">question</text>
      <rect x="235" y="150" width="125" height="76" rx="12" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="265" y="184">state</text><text x="260" y="204">variables</text>
      <rect x="410" y="150" width="125" height="76" rx="12" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="440" y="194">processes</text>
      <rect x="585" y="150" width="125" height="76" rx="12" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="615" y="194">equations</text>
      <rect x="760" y="150" width="110" height="76" rx="12" fill="#e7dff0" stroke="#64527b" stroke-width="2"/><text x="785" y="194">interpret</text>
    </g>
    <path d="M185 188 H235" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 188 H410" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M535 188 H585" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M710 188 H760" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
