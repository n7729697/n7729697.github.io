<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">FIR and IIR implementation tradeoffs</title>
  <desc id="desc">Comparison of filter choices across engineering criteria.</desc>
  <rect width="920" height="420" fill="#f8f5ee"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="56" font-size="26" font-weight="700">FIR or IIR?</text>
    <rect x="90" y="105" width="320" height="245" rx="20" fill="#d7e5cd" stroke="#486a50" stroke-width="2"/>
    <rect x="510" y="105" width="320" height="245" rx="20" fill="#d8e7ef" stroke="#426a7a" stroke-width="2"/>
    <text x="217" y="142" font-size="25" font-weight="700">FIR</text>
    <text x="637" y="142" font-size="25" font-weight="700">IIR</text>
    <g font-size="17">
      <text x="125" y="185">always stable</text><text x="125" y="220">linear phase possible</text><text x="125" y="255">higher order for sharp cutoff</text><text x="125" y="290">more latency, simple numerics</text>
      <text x="545" y="185">low order for sharp cutoff</text><text x="545" y="220">must verify pole stability</text><text x="545" y="255">nonlinear phase</text><text x="545" y="290">coefficient sensitivity</text>
    </g>
    <text x="190" y="382" font-size="15" fill="#5f625c">Choose from system constraints: phase, stability, compute budget, latency, and fixed-point risk.</text>
  </g>
</svg>
