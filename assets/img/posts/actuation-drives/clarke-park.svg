<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Clarke and Park transformations</title>
  <desc id="desc">Phase axes a, b, c at 120 degrees, the stationary alpha-beta frame, and the rotating d-q frame aligned with the rotor magnet at electrical angle theta-e; the stator current vector decomposes into i-d and i-q.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="980" height="470" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Clarke and Park: three AC currents → one rotating vector → two DC numbers</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>abc → αβ removes redundancy (i</tspan><tspan dy="3.9" font-size="10">a</tspan><tspan dy="-3.9"> + i</tspan><tspan dy="3.9" font-size="10">b</tspan><tspan dy="-3.9"> + i</tspan><tspan dy="3.9" font-size="10">c</tspan><tspan dy="-3.9"> = 0); αβ → dq rotates with the rotor at θ</tspan><tspan dy="3.9" font-size="10">e</tspan><tspan dy="-3.9"> = p θ</tspan><tspan dy="3.9" font-size="10">m</tspan></text>
    <line x1="260" y1="280" x2="420.0" y2="280.0" stroke="#6f6a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="436.0" y="280.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>a</tspan></text>
    <line x1="260" y1="280" x2="180.00000000000003" y2="141.4359353944898" stroke="#6f6a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="172.00000000000006" y="127.57952893393878" font-size="15" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>b</tspan></text>
    <line x1="260" y1="280" x2="179.99999999999994" y2="418.5640646055101" stroke="#6f6a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="171.99999999999991" y="432.42047106606117" font-size="15" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>c</tspan></text>
    <line x1="240" y1="280" x2="460.0" y2="280.0" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="460.0" y="300.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>α</tspan></text>
    <line x1="260" y1="300" x2="260.0" y2="100.0" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="274.0" y="106.0" font-size="16" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>β</tspan></text>
    <line x1="260" y1="280" x2="399.2558475291286" y2="182.49200582032216" stroke="#426a7a" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="407.2558475291286" y="178.49200582032216" font-size="14" text-anchor="start" font-weight="normal" fill="#426a7a" xml:space="preserve" style="white-space:pre"><tspan>d (magnet, ψ</tspan><tspan dy="3.9" font-size="10">m</tspan><tspan dy="-3.9">)</tspan></text>
    <line x1="260" y1="280" x2="173.96353454734307" y2="157.12719335665125" stroke="#806632" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="163.96353454734307" y="149.12719335665125" font-size="15" text-anchor="end" font-weight="normal" fill="#806632" xml:space="preserve" style="white-space:pre"><tspan>q</tspan></text>
    <line x1="260" y1="280" x2="225.05942891115967" y2="149.60001345097578" stroke="#b5462f" stroke-width="3" marker-end="url(#ah)"/>
    <text x="219.05942891115967" y="139.60001345097578" font-size="15" text-anchor="end" font-weight="normal" fill="#b5462f" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="4.2" font-size="10">s</tspan></text>
    <line x1="225.05942891115967" y1="149.60001345097578" x2="297.8224774450868" y2="253.5164161791835" stroke="#b5462f" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="267.8224774450868" y="249.5164161791835" font-size="13" text-anchor="start" font-weight="normal" fill="#b5462f" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.6" font-size="9">d</tspan></text>
    <path d="M 300 280 A 40 40 0 0 0 292.8 257.1" stroke="#263230" stroke-width="1.5" fill="none"/>
    <text x="308" y="270" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>θ</tspan><tspan dy="3.6" font-size="9">e</tspan></text>
    <rect x="520" y="100" width="440" height="320" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="540" y="130" font-size="14" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Clarke (amplitude-invariant):</tspan></text>
    <text x="540" y="155" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.9" font-size="10">α</tspan><tspan dy="-3.9"> = i</tspan><tspan dy="3.9" font-size="10">a</tspan></text>
    <text x="540" y="180" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.9" font-size="10">β</tspan><tspan dy="-3.9"> = (i</tspan><tspan dy="3.9" font-size="10">a</tspan><tspan dy="-3.9"> + 2 i</tspan><tspan dy="3.9" font-size="10">b</tspan><tspan dy="-3.9">) / √3</tspan></text>
    <text x="540" y="215" font-size="14" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Park (rotate by −θ</tspan><tspan dy="3.9" font-size="10">e</tspan><tspan dy="-3.9">):</tspan></text>
    <text x="540" y="240" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.9" font-size="10">d</tspan><tspan dy="-3.9"> =  i</tspan><tspan dy="3.9" font-size="10">α</tspan><tspan dy="-3.9"> cos θ</tspan><tspan dy="3.9" font-size="10">e</tspan><tspan dy="-3.9"> + i</tspan><tspan dy="3.9" font-size="10">β</tspan><tspan dy="-3.9"> sin θ</tspan><tspan dy="3.9" font-size="10">e</tspan></text>
    <text x="540" y="265" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.9" font-size="10">q</tspan><tspan dy="-3.9"> = −i</tspan><tspan dy="3.9" font-size="10">α</tspan><tspan dy="-3.9"> sin θ</tspan><tspan dy="3.9" font-size="10">e</tspan><tspan dy="-3.9"> + i</tspan><tspan dy="3.9" font-size="10">β</tspan><tspan dy="-3.9"> cos θ</tspan><tspan dy="3.9" font-size="10">e</tspan></text>
    <text x="540" y="300" font-size="14" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Torque (p pole pairs):</tspan></text>
    <text x="540" y="325" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>T = (3/2) p [ψ</tspan><tspan dy="3.9" font-size="10">m</tspan><tspan dy="-3.9"> i</tspan><tspan dy="3.9" font-size="10">q</tspan><tspan dy="-3.9"> + (L</tspan><tspan dy="3.9" font-size="10">d</tspan><tspan dy="-3.9"> − L</tspan><tspan dy="3.9" font-size="10">q</tspan><tspan dy="-3.9">) i</tspan><tspan dy="3.9" font-size="10">d</tspan><tspan dy="-3.9"> i</tspan><tspan dy="3.9" font-size="10">q</tspan><tspan dy="-3.9">]</tspan></text>
    <text x="540" y="360" font-size="13" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.6" font-size="9">q</tspan><tspan dy="-3.6">: current in quadrature with the magnet → torque</tspan></text>
    <text x="540" y="382" font-size="13" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.6" font-size="9">d</tspan><tspan dy="-3.6">: current along the magnet → field (0 below base</tspan></text>
    <text x="540" y="400" font-size="13" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>speed; negative for field weakening; MTPA if L</tspan><tspan dy="3.6" font-size="9">d</tspan><tspan dy="-3.6"> ≠ L</tspan><tspan dy="3.6" font-size="9">q</tspan><tspan dy="-3.6">)</tspan></text>
  </g>
</svg>
