<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Fluid validation loop</title><desc id="desc">Validation loop linking regime analysis, hand estimates, CFD, experiments, conservation checks, and design decisions.</desc><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.text{font-family:Georgia,serif;font-size:19px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style><rect width="980" height="520" fill="#f8f4ea"/><rect x="390" y="210" width="200" height="90" rx="14" class="core"/><text x="490" y="245" class="text">design decision</text><text x="490" y="272" class="small">bounded by evidence</text><rect x="100" y="110" width="180" height="75" rx="12" class="node"/><text x="190" y="155" class="text">regime</text><rect x="400" y="80" width="180" height="75" rx="12" class="node"/><text x="490" y="125" class="text">hand estimates</text><rect x="700" y="110" width="180" height="75" rx="12" class="node"/><text x="790" y="155" class="text">CFD</text><rect x="625" y="360" width="180" height="75" rx="12" class="node"/><text x="715" y="405" class="text">experiment</text><rect x="175" y="360" width="180" height="75" rx="12" class="node"/><text x="265" y="405" class="text">conservation</text></svg>
