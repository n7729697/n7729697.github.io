<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">MinHash and LSH candidate pipeline</title>
  <desc id="desc">Shingles become MinHash signatures, signatures go into LSH buckets, and candidates are verified exactly.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#415853"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Subquadratic Similarity Search</text>
    <rect x="70" y="130" width="135" height="90" rx="14" fill="#ead0c8" stroke="#8a594b" stroke-width="2"/><text x="105" y="166" font-size="16">shingles</text><text x="94" y="190" font-size="16">sets A, B</text>
    <rect x="260" y="130" width="135" height="90" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="293" y="166" font-size="16">MinHash</text><text x="288" y="190" font-size="16">signature</text>
    <rect x="450" y="130" width="135" height="90" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="493" y="166" font-size="16">LSH</text><text x="484" y="190" font-size="16">buckets</text>
    <rect x="640" y="130" width="170" height="90" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="682" y="166" font-size="16">candidate pairs</text><text x="685" y="190" font-size="16">exact verify</text>
    <path d="M205 175 H260" stroke="#415853" stroke-width="3" marker-end="url(#arrow)"/><path d="M395 175 H450" stroke="#415853" stroke-width="3" marker-end="url(#arrow)"/><path d="M585 175 H640" stroke="#415853" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="220" y="288" font-size="18">Pr[signature match] = J(A, B)</text>
    <text x="178" y="322" font-size="15" fill="#5f625c">The art is tuning buckets so likely matches survive while most impossible pairs are never compared.</text>
  </g>
</svg>
