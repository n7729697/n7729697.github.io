<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">RAG system boundary</title>
  <desc id="desc">Offline ingestion and online answer generation in a RAG system.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">RAG Has Two Coupled Loops</text>
    <rect x="75" y="115" width="330" height="210" rx="18" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="185" y="150" font-size="21">offline indexing</text><text x="120" y="195" font-size="16">parse -> chunk -> embed -> store</text><text x="120" y="230" font-size="16">metadata + provenance</text>
    <rect x="515" y="115" width="330" height="210" rx="18" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="625" y="150" font-size="21">online answering</text><text x="565" y="195" font-size="16">query -> retrieve -> prompt</text><text x="565" y="230" font-size="16">generate -> cite -> evaluate</text>
    <path d="M405 220 H515" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M680 325 C600 380 310 380 235 325" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="360" y="370" font-size="15">feedback updates chunking, metadata, and retrieval strategy</text>
  </g>
</svg>
