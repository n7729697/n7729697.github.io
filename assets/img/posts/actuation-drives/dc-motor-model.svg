<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">DC motor equivalent circuit and block diagram</title>
  <desc id="desc">Armature circuit with resistance, inductance and back-EMF coupled to rotor inertia, damping and load torque; block diagram showing the back-EMF as an inherent speed feedback loop.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="980" height="470" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>DC motor: two coupled first-order systems</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>the back-EMF k</tspan><tspan dy="3.9" font-size="10">e</tspan><tspan dy="-3.9"> ω closes a speed feedback loop inside the motor itself</tspan></text>
    <text x="40" y="110" font-size="16" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>V</tspan></text>
    <line x1="60" y1="135" x2="100" y2="135" stroke="#263230" stroke-width="2"/>
    <rect x="100" y="120" width="80" height="30" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="140.0" y="139.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>R</tspan></text>
    <line x1="180" y1="135" x2="210" y2="135" stroke="#263230" stroke-width="2"/>
    <path d="M210 135 q8 -16 16 0 q8 -16 16 0 q8 -16 16 0 q8 -16 16 0" stroke="#263230" stroke-width="2" fill="none"/>
    <text x="240" y="115" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>L</tspan></text>
    <line x1="274" y1="135" x2="310" y2="135" stroke="#263230" stroke-width="2"/>
    <circle cx="330" cy="170" r="24" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="330" y="174.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>e</tspan></text>
    <line x1="310" y1="135" x2="330" y2="135" stroke="#263230" stroke-width="2"/>
    <line x1="330" y1="135" x2="330" y2="146" stroke="#263230" stroke-width="2"/>
    <line x1="330" y1="194" x2="330" y2="210" stroke="#263230" stroke-width="2"/>
    <line x1="330" y1="210" x2="60" y2="210" stroke="#263230" stroke-width="2"/>
    <line x1="60" y1="210" x2="60" y2="150" stroke="#263230" stroke-width="2"/>
    <text x="370" y="175" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>e = k</tspan><tspan dy="3.6" font-size="9">e</tspan><tspan dy="-3.6"> ω</tspan></text>
    <line x1="120" y1="105" x2="170" y2="105" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="145.0" y="99.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>i</tspan></text>
    <text x="40" y="240" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>V = R i + L di/dt + k</tspan><tspan dy="3.9" font-size="10">e</tspan><tspan dy="-3.9"> ω</tspan></text>
    <circle cx="600" cy="140" r="40" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="600" y="144.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>J</tspan></text>
    <text x="660" y="120" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>τ</tspan><tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6"> = k</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> i</tspan></text>
    <text x="660" y="145" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>− b ω − τ</tspan><tspan dy="3.6" font-size="9">L</tspan></text>
    <text x="660" y="170" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>J ω̇ = k</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> i − b ω − τ</tspan><tspan dy="3.6" font-size="9">L</tspan></text>
    <text x="540" y="200" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>rotor + reflected load</tspan></text>
    <circle cx="80" cy="300" r="14" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="80" y="304.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Σ</tspan></text>
    <text x="20" y="305" font-size="14" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>V</tspan></text>
    <line x1="34" y1="300" x2="66" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="150" y="275" width="120" height="50" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="210.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>1/(L s + R)</tspan></text>
    <line x1="94" y1="300" x2="150" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="320" y="275" width="70" height="50" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="355.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>k</tspan><tspan dy="3.9" font-size="10">t</tspan></text>
    <line x1="270" y1="300" x2="320" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="295.0" y="292.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>i</tspan></text>
    <circle cx="450" cy="300" r="14" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="450" y="304.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Σ</tspan></text>
    <line x1="390" y1="300" x2="436" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="413.0" y="292.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>τ</tspan><tspan dy="3.4" font-size="8">m</tspan></text>
    <rect x="520" y="275" width="120" height="50" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="580.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>1/(J s + b)</tspan></text>
    <line x1="464" y1="300" x2="520" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="640" y1="300" x2="760" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="700.0" y="292.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>ω</tspan></text>
    <rect x="760" y="275" width="70" height="50" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="795.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>1/s</tspan></text>
    <line x1="830" y1="300" x2="890" y2="300" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="860.0" y="292.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>θ</tspan></text>
    <line x1="450" y1="230" x2="450" y2="286" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="458" y="245" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>− τ</tspan><tspan dy="3.6" font-size="9">L</tspan></text>
    <path d="M 700 300 L 700 380 L 355 380" stroke="#263230" stroke-width="2" fill="none"/>
    <rect x="300" y="358" width="110" height="44" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="355.0" y="384.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>k</tspan><tspan dy="3.9" font-size="10">e</tspan></text>
    <path d="M 300 380 L 80 380 L 80 314" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="90" y="350" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>− e</tspan></text>
    <text x="40" y="425" font-size="13" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>poles of ω/V:  (L s + R)(J s + b) + k</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> k</tspan><tspan dy="3.6" font-size="9">e</tspan><tspan dy="-3.6"> = 0    →    τ</tspan><tspan dy="3.6" font-size="9">e</tspan><tspan dy="-3.6"> = L/R  &lt;&lt;  τ</tspan><tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6"> = R J/(k</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> k</tspan><tspan dy="3.6" font-size="9">e</tspan><tspan dy="-3.6">)</tspan></text>
  </g>
</svg>
