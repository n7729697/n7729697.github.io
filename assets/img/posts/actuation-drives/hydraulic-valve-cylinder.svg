<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Valve-controlled hydraulic cylinder</title>
  <desc id="desc">A four-way spool valve meters flow into the two chambers of a double-acting cylinder; chamber pressures act on the piston; oil compressibility and leakage create a hydraulic spring.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="980" height="470" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Valve-controlled cylinder: flow, pressure, compressibility</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>spool displacement x</tspan><tspan dy="3.9" font-size="10">v</tspan><tspan dy="-3.9"> meters Q</tspan><tspan dy="3.9" font-size="10">A</tspan><tspan dy="-3.9"> and Q</tspan><tspan dy="3.9" font-size="10">B</tspan><tspan dy="-3.9">; chamber pressure builds through the bulk modulus β</tspan></text>
    <rect x="40" y="110" width="130" height="60" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="105.0" y="144.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>supply p</tspan><tspan dy="3.9" font-size="10">s</tspan></text>
    <rect x="40" y="300" width="130" height="60" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="105.0" y="334.9" font-size="14" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>tank p</tspan><tspan dy="3.9" font-size="10">t</tspan><tspan dy="-3.9"> ≈ 0</tspan></text>
    <rect x="230" y="170" width="220" height="130" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="340" y="195" font-size="14" text-anchor="middle" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>4-way spool valve</tspan></text>
    <text x="262" y="290" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>P</tspan></text>
    <text x="314" y="290" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>A</tspan></text>
    <text x="366" y="290" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>B</tspan></text>
    <text x="418" y="290" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>T</tspan></text>
    <rect x="250" y="215" width="180" height="40" rx="4" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="340" y="240" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>spool, x</tspan><tspan dy="3.6" font-size="9">v</tspan></text>
    <line x1="170" y1="140" x2="262" y2="215" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="262" y1="300" x2="170" y2="330" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="560" y="170" width="300" height="130" rx="6" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <rect x="690" y="172" width="22" height="126" fill="#4e6f52"/>
    <rect x="712" y="226" width="230" height="18" fill="#9fb59a" stroke="#4e6f52"/>
    <text x="620" y="240" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>chamber A</tspan></text>
    <text x="620" y="257" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>p</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6">, V</tspan><tspan dy="3.6" font-size="9">A</tspan></text>
    <text x="785" y="205" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>chamber B</tspan></text>
    <text x="785" y="222" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>p</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6">, V</tspan><tspan dy="3.6" font-size="9">B</tspan></text>
    <rect x="870" y="205" width="90" height="60" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="915.0" y="231.05" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>mass m</tspan></text>
    <text x="915.0" y="248.05" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>load F</tspan><tspan dy="3.6" font-size="9">L</tspan></text>
    <path d="M 314 170 L 314 140 L 610 140 L 610 170" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="460" y="132" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Q</tspan><tspan dy="3.6" font-size="9">A</tspan></text>
    <path d="M 800 172 L 800 155 L 366 155 L 366 168" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="560" y="150" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>Q</tspan><tspan dy="3.4" font-size="8">B</tspan><tspan dy="-3.4"> (return)</tspan></text>
    <line x1="700" y1="330" x2="780" y2="330" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="740.0" y="348.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>piston velocity ẋ</tspan></text>
    <text x="40" y="415" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Orifice:  Q</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> = C</tspan><tspan dy="3.6" font-size="9">d</tspan><tspan dy="-3.6"> w x</tspan><tspan dy="3.6" font-size="9">v</tspan><tspan dy="-3.6"> √(2(p</tspan><tspan dy="3.6" font-size="9">s</tspan><tspan dy="-3.6"> − p</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6">)/ρ)        Continuity:  ṗ</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> = β/V</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> (Q</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> − A ẋ − C</tspan><tspan dy="3.6" font-size="9">l</tspan><tspan dy="-3.6"> (p</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> − p</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6">))</tspan></text>
    <text x="40" y="440" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Force:  m ẍ = A(p</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> − p</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6">) − b ẋ − F</tspan><tspan dy="3.6" font-size="9">c</tspan><tspan dy="-3.6"> sign(ẋ) − F</tspan><tspan dy="3.6" font-size="9">L</tspan><tspan dy="-3.6">        Hydraulic spring:  k</tspan><tspan dy="3.6" font-size="9">h</tspan><tspan dy="-3.6"> = β A² (1/V</tspan><tspan dy="3.6" font-size="9">A</tspan><tspan dy="-3.6"> + 1/V</tspan><tspan dy="3.6" font-size="9">B</tspan><tspan dy="-3.6">),  ω</tspan><tspan dy="3.6" font-size="9">h</tspan><tspan dy="-3.6"> = √(k</tspan><tspan dy="3.6" font-size="9">h</tspan><tspan dy="-3.6"> / m)</tspan></text>
  </g>
</svg>
