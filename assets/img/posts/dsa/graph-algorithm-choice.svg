<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Graph algorithm choice</title><desc id="desc">Graph algorithm selection based on graph query and edge assumptions.</desc><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.text{font-family:Georgia,serif;font-size:19px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:14px;fill:#3b4750;text-anchor:middle}</style><rect width="980" height="520" fill="#f8f4ea"/><rect x="390" y="60" width="200" height="75" rx="12" class="core"/><text x="490" y="105" class="text">graph problem</text><rect x="85" y="210" width="180" height="80" rx="12" class="node"/><text x="175" y="242" class="text">reachability</text><text x="175" y="266" class="small">BFS / DFS</text><rect x="300" y="210" width="180" height="80" rx="12" class="node"/><text x="390" y="242" class="text">shortest path</text><text x="390" y="266" class="small">BFS/Dijkstra/BF</text><rect x="515" y="210" width="180" height="80" rx="12" class="node"/><text x="605" y="242" class="text">connect cheaply</text><text x="605" y="266" class="small">MST</text><rect x="730" y="210" width="180" height="80" rx="12" class="node"/><text x="820" y="242" class="text">capacity</text><text x="820" y="266" class="small">max flow</text><text x="490" y="395" class="small">Weights, density, directedness, negative edges, and query count decide the algorithm.</text></svg>
