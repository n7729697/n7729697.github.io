<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Utilization waiting curve</title><desc id="desc">Waiting time rises nonlinearly as utilization approaches one.</desc><style>.axis{stroke:#3f5663;stroke-width:4}.curve{stroke:#b45d47;stroke-width:6;fill:none}.safe{fill:#dcebdc;opacity:.7}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750}</style><rect width="980" height="500" fill="#f8f4ea"/><line x1="110" y1="400" x2="860" y2="400" class="axis"/><line x1="110" y1="400" x2="110" y2="85" class="axis"/><rect x="110" y="100" width="480" height="300" class="safe"/><path d="M130 380 C300 360 480 310 620 210 C720 135 785 95 850 90" class="curve"/><text x="640" y="440" class="small">utilization ρ</text><text x="35" y="130" class="small">waiting</text><text x="600" y="175" class="text">near full loading, waiting explodes</text></svg>
