<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Cycle exergy losses</title>
  <desc id="desc">Thermal cycle with heat source, turbine, compressor or pump, heat sink, work output, and exergy destruction locations.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.hot{fill:#f1d8cc;stroke:#b45d47;stroke-width:3}.cold{fill:#d8e4ef;stroke:#607c94;stroke-width:3}.dev{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.loss{fill:#fff0ca;stroke:#b89057;stroke-width:3}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs>
  <rect width="980" height="540" fill="#f8f4ea"/>
  <rect x="105" y="110" width="170" height="75" rx="12" class="hot"/><text x="190" y="155" class="text">heat source</text>
  <rect x="405" y="120" width="170" height="75" rx="12" class="dev"/><text x="490" y="165" class="text">expander</text>
  <rect x="705" y="110" width="170" height="75" rx="12" class="loss"/><text x="790" y="145" class="text">losses</text><text x="790" y="168" class="small">friction, ΔT, Δp</text>
  <rect x="405" y="340" width="170" height="75" rx="12" class="dev"/><text x="490" y="385" class="text">pump/compressor</text>
  <rect x="105" y="340" width="170" height="75" rx="12" class="cold"/><text x="190" y="385" class="text">heat sink</text>
  <path d="M275 148 H405" class="arrow"/><path d="M575 158 H705" class="arrow"/><path d="M790 185 C760 280 640 350 575 375" class="arrow"/><path d="M405 378 H275" class="arrow"/><path d="M490 120 V65" class="arrow"/><text x="515" y="75" class="small">work out</text>
  <text x="490" y="480" class="small">Exergy analysis asks which component destroys the most useful work potential.</text>
</svg>
