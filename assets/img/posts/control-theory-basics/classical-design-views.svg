<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Classical control design views</title>
  <desc id="desc">Map showing Routh-Hurwitz, root locus, Bode, Nyquist, and Nichols as different views of the same closed-loop design question.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/>
    </marker>
    <style>
      .center{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}
      .node{fill:#fff7e8;stroke:#b89057;stroke-width:3}
      .arrow{stroke:#45545e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}
      .small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}
    </style>
  </defs>
  <rect width="980" height="560" fill="#f8f4ea"/>
  <rect x="365" y="230" width="250" height="100" rx="14" class="center"/>
  <text x="490" y="270" class="text">closed-loop design</text>
  <text x="490" y="298" class="small">speed, damping, accuracy, robustness</text>
  <rect x="90" y="80" width="190" height="80" rx="12" class="node"/>
  <text x="185" y="113" class="text">Routh</text>
  <text x="185" y="138" class="small">polynomial stability</text>
  <rect x="395" y="60" width="190" height="80" rx="12" class="node"/>
  <text x="490" y="93" class="text">Root locus</text>
  <text x="490" y="118" class="small">poles vs gain</text>
  <rect x="700" y="80" width="190" height="80" rx="12" class="node"/>
  <text x="795" y="113" class="text">Bode</text>
  <text x="795" y="138" class="small">bandwidth, margins</text>
  <rect x="155" y="390" width="190" height="80" rx="12" class="node"/>
  <text x="250" y="423" class="text">Nyquist</text>
  <text x="250" y="448" class="small">encirclements</text>
  <rect x="635" y="390" width="190" height="80" rx="12" class="node"/>
  <text x="730" y="423" class="text">Nichols</text>
  <text x="730" y="448" class="small">gain-phase shaping</text>
  <path d="M250 160 C310 190 350 220 365 250" class="arrow"/>
  <path d="M490 140 V225" class="arrow"/>
  <path d="M730 160 C670 190 635 220 615 250" class="arrow"/>
  <path d="M315 390 C350 360 385 335 420 330" class="arrow"/>
  <path d="M665 390 C630 360 595 335 560 330" class="arrow"/>
</svg>
