<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">RAII lifecycle timeline</title>
  <desc id="desc">Timeline showing constructor acquisition, scoped use, and destructor release under normal return or exception.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/>
    </marker>
    <style>
      .axis{stroke:#45545e;stroke-width:5;marker-end:url(#arrow)}
      .bar{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}
      .event{fill:#fff7e8;stroke:#b89057;stroke-width:3}
      .alt{stroke:#a3563d;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#arrow)}
      .text{font-family:Georgia,serif;font-size:22px;fill:#26313a;text-anchor:middle}
      .small{font-family:Georgia,serif;font-size:16px;fill:#3b4750;text-anchor:middle}
    </style>
  </defs>
  <rect width="980" height="500" fill="#f8f4ea"/>
  <line x1="90" y1="255" x2="880" y2="255" class="axis"/>
  <rect x="220" y="205" width="520" height="100" rx="16" class="bar"/>
  <text x="480" y="245" class="text">resource is valid inside scope</text>
  <text x="480" y="276" class="small">file, lock, socket, sensor handle, allocation</text>
  <rect x="95" y="185" width="150" height="90" rx="12" class="event"/>
  <text x="170" y="220" class="text">construct</text>
  <text x="170" y="248" class="small">acquire</text>
  <rect x="735" y="185" width="150" height="90" rx="12" class="event"/>
  <text x="810" y="220" class="text">destruct</text>
  <text x="810" y="248" class="small">release</text>
  <path d="M480 205 C500 145 620 120 760 185" class="alt"/>
  <text x="565" y="105" class="small">exception path still unwinds stack</text>
  <text x="490" y="390" class="small">RAII turns cleanup from a remembered action into a lifetime invariant.</text>
</svg>
