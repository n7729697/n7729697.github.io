<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">C++ ownership graph</title>
  <desc id="desc">Diagram showing unique pointer exclusive ownership, shared pointers co-owning an object, weak pointer observation, and raw pointer or reference non-owning observation.</desc>
  <defs>
    <marker id="own" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#49633f"/>
    </marker>
    <marker id="obs" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <style>
      .node{fill:#fff7e8;stroke:#b89057;stroke-width:3}
      .obj{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}
      .own{stroke:#49633f;stroke-width:4;fill:none;marker-end:url(#own)}
      .obs{stroke:#6b7280;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#obs)}
      .text{font-family:Georgia,serif;font-size:21px;fill:#26313a;text-anchor:middle}
      .small{font-family:Georgia,serif;font-size:16px;fill:#3b4750;text-anchor:middle}
    </style>
  </defs>
  <rect width="980" height="540" fill="#f8f4ea"/>
  <rect x="400" y="210" width="180" height="90" rx="14" class="obj"/>
  <text x="490" y="246" class="text">Sensor</text>
  <text x="490" y="272" class="small">resource object</text>
  <rect x="95" y="90" width="190" height="78" rx="12" class="node"/>
  <text x="190" y="123" class="text">unique_ptr</text>
  <text x="190" y="147" class="small">exclusive owner</text>
  <path d="M285 150 C345 175 380 205 405 225" class="own"/>
  <rect x="700" y="80" width="190" height="78" rx="12" class="node"/>
  <text x="795" y="113" class="text">shared_ptr A</text>
  <text x="795" y="137" class="small">shared owner</text>
  <rect x="700" y="185" width="190" height="78" rx="12" class="node"/>
  <text x="795" y="218" class="text">shared_ptr B</text>
  <text x="795" y="242" class="small">shared owner</text>
  <path d="M700 130 C645 160 610 200 580 225" class="own"/>
  <path d="M700 225 H580" class="own"/>
  <rect x="700" y="330" width="190" height="78" rx="12" class="node"/>
  <text x="795" y="363" class="text">weak_ptr</text>
  <text x="795" y="387" class="small">non-owning check</text>
  <path d="M700 360 C645 345 610 310 575 285" class="obs"/>
  <rect x="95" y="340" width="190" height="78" rx="12" class="node"/>
  <text x="190" y="373" class="text">raw ptr/ref</text>
  <text x="190" y="397" class="small">non-owning view</text>
  <path d="M285 370 C345 335 380 305 405 282" class="obs"/>
  <text x="490" y="470" class="small">Solid arrows own lifetime. Dashed arrows observe an object whose lifetime is controlled elsewhere.</text>
</svg>
