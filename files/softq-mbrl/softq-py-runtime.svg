<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f5fa8"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b5452a"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b7d3b"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a3f80"/></marker>
  </defs>
  <rect width="1240" height="800" fill="#ffffff"/>
  <text x="620" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">SoftQ.py: the middle layer between the policy and the hardware</text>

  <!-- Process 1: Simulink -->
  <rect x="20" y="60" width="270" height="480" rx="10" fill="#fdf3e7" stroke="#b5452a" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="155" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#b5452a">Process 1: Simulink</text>
  <text x="155" y="108" text-anchor="middle" font-size="13" fill="#555">laptop, external mode</text>
  <rect x="45" y="130" width="220" height="70" rx="6" fill="#fff" stroke="#b5452a"/>
  <text x="155" y="158" text-anchor="middle" font-size="15" font-weight="bold">State estimate</text>
  <text x="155" y="178" text-anchor="middle" font-size="12" fill="#555">Kalman filter, binarised contact</text>
  <rect x="45" y="225" width="220" height="70" rx="6" fill="#fff" stroke="#b5452a"/>
  <text x="155" y="253" text-anchor="middle" font-size="15" font-weight="bold">Control policy (SAC actor)</text>
  <text x="155" y="273" text-anchor="middle" font-size="12" fill="#555">14 observations to 4 actions, Ts = 50 ms</text>
  <rect x="45" y="320" width="220" height="70" rx="6" fill="#fff" stroke="#b5452a"/>
  <text x="155" y="348" text-anchor="middle" font-size="15" font-weight="bold">Kinematics conversion</text>
  <text x="155" y="368" text-anchor="middle" font-size="12" fill="#555">inverse kinematics to 12 angles</text>
  <path d="M155 200 L155 225" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M155 295 L155 320" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="155" y="430" text-anchor="middle" font-size="12" fill="#555">training happens offline in the surrogate;</text>
  <text x="155" y="448" text-anchor="middle" font-size="12" fill="#555">this process only runs the learned policy</text>

  <!-- Process 2: Raspberry Pi -->
  <rect x="385" y="60" width="520" height="720" rx="10" fill="#f4e9f3" stroke="#a65d9b" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="645" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3f80">Process 2: Raspberry Pi, Python process "SoftQ"</text>
  <text x="645" y="108" text-anchor="middle" font-size="12.5" fill="#555">one process, four periodic threads, one lock (the GIL gives concurrency, not parallel CPU use)</text>

  <rect x="415" y="130" width="230" height="135" rx="8" fill="#fff" stroke="#8a3f80"/>
  <text x="530" y="154" text-anchor="middle" font-size="14" font-weight="bold">tcp_Transmit  (51 ms)</text>
  <text x="430" y="178" font-size="12">1. read 5 x ToF (I2C)</text>
  <text x="430" y="196" font-size="12">2. read IMU quaternion</text>
  <text x="430" y="214" font-size="12">3. quaternion to Euler angles</text>
  <text x="430" y="232" font-size="12">4. send 60 B of floats</text>
  <text x="430" y="254" font-size="12" fill="#b5452a">on error: neutral pose, reconnect</text>

  <rect x="415" y="290" width="230" height="135" rx="8" fill="#fff" stroke="#8a3f80"/>
  <text x="530" y="314" text-anchor="middle" font-size="14" font-weight="bold">tcp_Recieve  (10 ms poll)</text>
  <text x="430" y="338" font-size="12">1. recv up to 1024 B</text>
  <text x="430" y="356" font-size="12">2. accept the frame only if len = 12</text>
  <text x="430" y="374" font-size="12">3. store the motor commands</text>
  <text x="430" y="392" font-size="12">4. countdown_flag = True,</text>
  <text x="430" y="410" font-size="12">    relay command = 200 (on)</text>

  <rect x="665" y="130" width="230" height="135" rx="8" fill="#fff" stroke="#8a3f80"/>
  <text x="780" y="154" text-anchor="middle" font-size="14" font-weight="bold">Write_Read_STM32  (49 ms)</text>
  <text x="680" y="178" font-size="12">1. write 18 B command frame</text>
  <text x="680" y="196" font-size="12">2. read 19 B reply (10 ms timeout)</text>
  <text x="680" y="214" font-size="12">3. check the last byte is 'B'</text>
  <text x="680" y="232" font-size="12">4. store 4 x float of foot force</text>
  <text x="680" y="254" font-size="12" fill="#b5452a">bad frame: log, keep the last FSR</text>

  <rect x="665" y="290" width="230" height="135" rx="8" fill="#fff" stroke="#8a3f80"/>
  <text x="780" y="314" text-anchor="middle" font-size="14" font-weight="bold">Countdown_Timer  (2 s)</text>
  <text x="680" y="338" font-size="12">flag set: relays stay on</text>
  <text x="680" y="356" font-size="12">flag clear: neutral pose,</text>
  <text x="680" y="374" font-size="12">    relays off (deadman)</text>
  <text x="680" y="392" font-size="12">then clear the flag</text>
  <text x="680" y="414" font-size="12" fill="#b5452a">this is the safety layer</text>

  <rect x="415" y="470" width="480" height="150" rx="8" fill="#fff" stroke="#8a3f80" stroke-width="2"/>
  <text x="655" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3f80">Shared state, guarded by threading.Lock</text>
  <text x="432" y="522" font-size="13">SensorData: distance[5], acc[3], quat[4], euler[3], fsr[16 B]</text>
  <text x="432" y="544" font-size="13">SofQData: motor_commands[12 B], relay_commands[2 B]</text>
  <text x="432" y="566" font-size="13">countdown_flag, set on every valid command</text>
  <text x="432" y="588" font-size="12" fill="#555">neutral pose: [90,85,80,93,91,83,92,82,85,85,90,87]</text>
  <text x="432" y="608" font-size="12" fill="#555">fixed-size frames, so a reader never sees a half-written command</text>
  <path d="M415 245 L406 245 L406 520 L415 520" fill="none" stroke="#8a3f80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahp)"/>
  <path d="M530 425 L530 470" stroke="#8a3f80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahp)"/>
  <path d="M780 425 L780 470" stroke="#8a3f80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahp)"/>

  <rect x="415" y="645" width="480" height="115" rx="8" fill="#fff" stroke="#8a3f80"/>
  <text x="655" y="669" text-anchor="middle" font-size="14" font-weight="bold">Start-up (main thread)</text>
  <text x="430" y="692" font-size="12">tof_setup: XSHUT lines low, wake one sensor at a time, give each an address 0x21 to 0x25</text>
  <text x="430" y="711" font-size="12">imu_setup: BNO055, restore its 22 calibration registers (0x55 to 0x6A), remap the axes</text>
  <text x="430" y="730" font-size="12">serial_setup (/dev/ttyAMA0, 115200 baud) and a TCP server; accept the Simulink client,</text>
  <text x="430" y="749" font-size="12">then start the four timers</text>

  <!-- Process 3: STM32 -->
  <rect x="990" y="60" width="230" height="480" rx="10" fill="#e9f1fb" stroke="#1f5fa8" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1105" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f5fa8">Process 3: STM32 G431KB</text>
  <text x="1105" y="108" text-anchor="middle" font-size="13" fill="#555">bare-metal HAL, super-loop</text>
  <rect x="1005" y="130" width="200" height="95" rx="6" fill="#fff" stroke="#1f5fa8"/>
  <text x="1105" y="154" text-anchor="middle" font-size="13" font-weight="bold">HAL_UART_Receive (18 B)</text>
  <text x="1105" y="174" text-anchor="middle" font-size="12">blocking, event-triggered</text>
  <text x="1105" y="192" text-anchor="middle" font-size="12">align: header first,</text>
  <text x="1105" y="208" text-anchor="middle" font-size="12">terminators last</text>
  <rect x="1005" y="245" width="200" height="85" rx="6" fill="#fff" stroke="#1f5fa8"/>
  <text x="1105" y="269" text-anchor="middle" font-size="13" font-weight="bold">12 servo channels</text>
  <text x="1105" y="289" text-anchor="middle" font-size="12">50 Hz PWM, 2.7 to 12 % duty</text>
  <text x="1105" y="307" text-anchor="middle" font-size="12">angle 0 to 180 deg, saturated</text>
  <rect x="1005" y="350" width="200" height="85" rx="6" fill="#fff" stroke="#1f5fa8"/>
  <text x="1105" y="374" text-anchor="middle" font-size="13" font-weight="bold">4 FSR, ADC + DMA</text>
  <text x="1105" y="394" text-anchor="middle" font-size="12">ratio = ADC value / 4096</text>
  <text x="1105" y="412" text-anchor="middle" font-size="12">reply: 'A', 4 floats, '8', 'B'</text>
  <rect x="1005" y="455" width="200" height="60" rx="6" fill="#fff" stroke="#1f5fa8"/>
  <text x="1105" y="479" text-anchor="middle" font-size="13" font-weight="bold">Power relay GPIO</text>
  <text x="1105" y="499" text-anchor="middle" font-size="12">command byte 200 = on</text>
  <path d="M1105 225 L1105 245" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Sensors -->
  <rect x="20" y="590" width="270" height="170" rx="10" fill="#eef6ee" stroke="#3b7d3b" stroke-width="2"/>
  <text x="155" y="618" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b7d3b">Sensors on the I2C bus</text>
  <text x="40" y="646" font-size="13">5 x VL53L1X time of flight</text>
  <text x="40" y="665" font-size="12" fill="#555">front, back, left, right, down</text>
  <text x="40" y="690" font-size="13">BNO055 IMU: quaternion,</text>
  <text x="40" y="708" font-size="13">linear acceleration, calibration</text>
  <text x="40" y="738" font-size="12" fill="#555">I2C reads are slow, so they sit in tcp_Transmit</text>

  <!-- Arrows: Simulink side -->
  <path d="M415 165 L290 165" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#ahb)"/>
  <text x="352" y="154" text-anchor="middle" font-size="11" fill="#1f5fa8">TCP, 60 B up</text>
  <path d="M290 355 L415 355" stroke="#b5452a" stroke-width="2.5" marker-end="url(#ahr)"/>
  <text x="352" y="344" text-anchor="middle" font-size="11" fill="#b5452a">TCP, 12 B down</text>
  <!-- Sensors to tcp_Transmit -->
  <path d="M290 670 L394 670 L394 215 L415 215" fill="none" stroke="#3b7d3b" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="389" y="440" font-size="11" fill="#3b7d3b" transform="rotate(-90 389 440)">I2C reads</text>
  <!-- STM32 side -->
  <path d="M895 172 L1005 172" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="950" y="164" text-anchor="middle" font-size="11" fill="#333">UART 18 B</text>
  <path d="M1005 205 L895 205" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="950" y="222" text-anchor="middle" font-size="11" fill="#333">UART 19 B</text>

  <!-- Legend -->
  <rect x="940" y="590" width="280" height="170" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="955" y="615" font-size="14" font-weight="bold">Reading the diagram</text>
  <text x="955" y="640" font-size="12">Three programs, three rates:</text>
  <text x="955" y="658" font-size="12">policy 20 Hz, Pi threads 10 to 100 Hz,</text>
  <text x="955" y="676" font-size="12">servo PWM 50 Hz, ADC continuous.</text>
  <text x="955" y="702" font-size="12">Every link is a fixed-size message,</text>
  <text x="955" y="720" font-size="12">so each side can be tested alone</text>
  <text x="955" y="738" font-size="12">and replaced independently.</text>
</svg>
