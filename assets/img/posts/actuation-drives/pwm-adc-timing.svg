<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">PWM-synchronous sampling and control timing</title>
  <desc id="desc">Center-aligned PWM counter, compare level and gate signal, ADC trigger at the counter peak, conversion, control interrupt execution, and preload of the new compare value at the next update event, over two PWM periods.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="1000" height="470" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Timing chain inside one control period</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>sample in the middle of the PWM pulse, compute, and load the new duty before the next update event</tspan></text>
    <text x="30" y="120" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>counter</tspan></text>
    <text x="30" y="195" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>gate (high side)</tspan></text>
    <text x="30" y="250" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>ADC</tspan></text>
    <text x="30" y="305" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>current-loop ISR</tspan></text>
    <text x="30" y="360" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>CCR shadow → active</tspan></text>
    <text x="30" y="415" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>speed thread</tspan></text>
    <path d="M 150.0 150 L 340.0 95 L 530.0 150" stroke="#263230" stroke-width="2" fill="none"/>
    <line x1="150.0" y1="128" x2="530.0" y2="128" stroke="#806632" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M 150.0 205 L 226.0 205 L 226.0 180 L 454.0 180 L 454.0 205 L 530.0 205" stroke="#426a7a" stroke-width="2" fill="none"/>
    <line x1="340.0" y1="95" x2="340.0" y2="240" stroke="#6f6a5f" stroke-width="1" stroke-dasharray="6 4"/>
    <rect x="340.0" y="235" width="40" height="22" rx="3" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="360.0" y="249.5" font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>conv</tspan></text>
    <rect x="385.0" y="290" width="110" height="24" rx="3" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="440.0" y="305.85" font-size="11" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>PI + limits</tspan></text>
    <line x1="490.0" y1="314" x2="490.0" y2="345" stroke="#b5462f" stroke-width="2" marker-end="url(#ahr)"/>
    <rect x="530.0" y="345" width="70" height="22" rx="3" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="565.0" y="359.5" font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>update</tspan></text>
    <path d="M 530.0 150 L 720.0 95 L 910.0 150" stroke="#263230" stroke-width="2" fill="none"/>
    <line x1="530.0" y1="128" x2="910.0" y2="128" stroke="#806632" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M 530.0 205 L 606.0 205 L 606.0 180 L 834.0 180 L 834.0 205 L 910.0 205" stroke="#426a7a" stroke-width="2" fill="none"/>
    <line x1="720.0" y1="95" x2="720.0" y2="240" stroke="#6f6a5f" stroke-width="1" stroke-dasharray="6 4"/>
    <rect x="720.0" y="235" width="40" height="22" rx="3" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="740.0" y="249.5" font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>conv</tspan></text>
    <rect x="765.0" y="290" width="110" height="24" rx="3" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="820.0" y="305.85" font-size="11" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>PI + limits</tspan></text>
    <line x1="870.0" y1="314" x2="870.0" y2="345" stroke="#b5462f" stroke-width="2" marker-end="url(#ahr)"/>
    <rect x="910.0" y="345" width="70" height="22" rx="3" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="945.0" y="359.5" font-size="10" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>update</tspan></text>
    <text x="347.6" y="90" font-size="11" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>peak: trigger ADC</tspan></text>
    <text x="535.0" y="122" font-size="11" text-anchor="start" font-weight="normal" fill="#806632" xml:space="preserve" style="white-space:pre"><tspan>compare (CCR)</tspan></text>
    <rect x="190" y="400" width="560" height="24" rx="3" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="470.0" y="415.85" font-size="11" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre">runs every 10th ISR (woken by a semaphore from the ISR); never writes PWM registers</text>
    <text x="150" y="458" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>one PWM period at 20 kHz = 50 µs;  ISR budget (WCET) must fit before the update event, including jitter</tspan></text>
  </g>
</svg>
