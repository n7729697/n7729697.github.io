<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent game architecture</title>
  <desc id="desc">Local utilities feed equilibrium solver, safety filter, and coordinated actions.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Game-Theoretic Plans Need Safety Filters</text>
    <rect x="80" y="150" width="150" height="82" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="116" y="198" font-size="16">local utilities</text>
    <rect x="300" y="150" width="150" height="82" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="325" y="198" font-size="16">equilibrium solver</text>
    <rect x="520" y="150" width="150" height="82" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="555" y="198" font-size="16">safety filter</text>
    <rect x="740" y="150" width="120" height="82" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="762" y="198" font-size="16">actions</text>
    <path d="M230 191 H300" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 191 H520" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M670 191 H740" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
