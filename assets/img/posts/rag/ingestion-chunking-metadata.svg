<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">RAG ingestion chunking metadata</title>
  <desc id="desc">Documents become chunks with embeddings and metadata in an index.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Ingestion Makes Evidence Searchable</text>
    <rect x="70" y="145" width="130" height="82" rx="12" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="102" y="181" font-size="16">documents</text>
    <rect x="260" y="145" width="130" height="82" rx="12" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="294" y="181" font-size="16">parse</text>
    <rect x="450" y="145" width="130" height="82" rx="12" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="488" y="181" font-size="16">chunks</text>
    <rect x="640" y="145" width="160" height="82" rx="12" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="676" y="181" font-size="16">index + metadata</text>
    <path d="M200 186 H260" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M390 186 H450" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 186 H640" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="185" y="315" font-size="15" fill="#5f625c">Metadata carries source, version, access policy, page, section, and parent document context.</text>
  </g>
</svg>
