<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Advanced RAG patterns</title>
  <desc id="desc">Advanced RAG repair patterns for query mismatch, routing, graph retrieval, and response synthesis.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Advanced RAG = Targeted Repair</text>
    <g font-size="16">
      <rect x="90" y="120" width="190" height="78" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="122" y="165">query rewrite</text>
      <rect x="365" y="120" width="190" height="78" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="400" y="165">decompose</text>
      <rect x="640" y="120" width="190" height="78" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="685" y="165">route tools</text>
      <rect x="225" y="245" width="190" height="78" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="255" y="290">graph/context expand</text>
      <rect x="505" y="245" width="190" height="78" rx="14" fill="#e7dff0" stroke="#64527b" stroke-width="2"/><text x="548" y="290">synthesize</text>
    </g>
    <text x="178" y="370" font-size="15" fill="#5f625c">Add complexity only after measuring which baseline failure it addresses.</text>
  </g>
</svg>
