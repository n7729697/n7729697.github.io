<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Composition law map</title>
  <desc id="desc">Objects and arrows compose associatively with identity arrows.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">A Category Is Lawful Composition</text>
    <circle cx="170" cy="210" r="45" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><circle cx="420" cy="210" r="45" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><circle cx="670" cy="210" r="45" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/>
    <text x="158" y="216" font-size="20">A</text><text x="408" y="216" font-size="20">B</text><text x="658" y="216" font-size="20">C</text>
    <path d="M215 210 H375" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M465 210 H625" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M205 170 C330 75 530 75 650 170" stroke="#405a58" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="286" y="196" font-size="18">f</text><text x="535" y="196" font-size="18">g</text><text x="410" y="105" font-size="18">g . f</text>
    <text x="250" y="326" font-size="18">id . f = f,  f . id = f,  h . (g . f) = (h . g) . f</text>
  </g>
</svg>
