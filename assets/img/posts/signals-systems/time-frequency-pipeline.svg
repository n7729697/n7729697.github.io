<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Signals and systems analysis pipeline</title>
  <desc id="desc">Pipeline from time waveform to system model, transform domain, sampled implementation, and interpretation.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#36545d"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263235">
    <text x="52" y="56" font-size="26" font-weight="700">From Waveform to Meaning</text>
    <g font-size="16">
      <rect x="65" y="130" width="150" height="86" rx="14" fill="#d7e3cd" stroke="#486a50" stroke-width="2"/><text x="102" y="164">time signal</text><text x="98" y="188">x(t), x[n]</text>
      <rect x="275" y="130" width="150" height="86" rx="14" fill="#ecd9ad" stroke="#806632" stroke-width="2"/><text x="321" y="164">system</text><text x="315" y="188">h, H</text>
      <rect x="485" y="130" width="150" height="86" rx="14" fill="#d5e6ef" stroke="#426a7a" stroke-width="2"/><text x="528" y="164">spectrum</text><text x="515" y="188">Fourier/Laplace/Z</text>
      <rect x="695" y="130" width="150" height="86" rx="14" fill="#ead2c8" stroke="#8b5849" stroke-width="2"/><text x="737" y="164">DSP</text><text x="719" y="188">sample + implement</text>
    </g>
    <path d="M215 173 H275" stroke="#36545d" stroke-width="3" marker-end="url(#arrow)"/><path d="M425 173 H485" stroke="#36545d" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 173 H695" stroke="#36545d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M140 275 C210 235 275 300 350 260 S505 255 575 286 S715 255 805 278" fill="none" stroke="#486a50" stroke-width="3"/>
    <text x="105" y="330" font-size="15" fill="#5b615c">The same phenomenon should make sense as a waveform, a convolution, a spectrum, and an implementation.</text>
  </g>
</svg>
