<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Little's Law boundary discipline</title><desc id="desc">WIP throughput and cycle time measured over the same process boundary.</desc><style>.sys{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.text{font-family:Georgia,serif;font-size:22px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style><rect width="980" height="500" fill="#f8f4ea"/><rect x="180" y="130" width="620" height="220" rx="18" class="sys"/><text x="490" y="105" class="text">same boundary</text><rect x="240" y="200" width="140" height="70" rx="10" class="node"/><text x="310" y="244" class="text">WIP</text><rect x="420" y="200" width="140" height="70" rx="10" class="node"/><text x="490" y="244" class="text">TH</text><rect x="600" y="200" width="140" height="70" rx="10" class="node"/><text x="670" y="244" class="text">CT</text><text x="490" y="405" class="text">WIP = TH · CT</text><text x="490" y="440" class="small">Do not mix queue-only WIP with end-to-end cycle time.</text></svg>
