<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Phase change and interface physics</title>
  <desc id="desc">Liquid vapor interface showing saturation equilibrium, nucleation bubble, heat flux, surface tension, and transport limitations.</desc>
  <style>.liq{fill:#d8e4ef;stroke:#607c94;stroke-width:3}.vap{fill:#fff7e8;stroke:#b89057;stroke-width:3}.bubble{fill:#f8f4ea;stroke:#607c94;stroke-width:4}.heat{stroke:#b45d47;stroke-width:5;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:21px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#b45d47"/></marker></defs>
  <rect width="980" height="540" fill="#f8f4ea"/>
  <rect x="100" y="270" width="780" height="155" class="liq"/><rect x="100" y="115" width="780" height="155" class="vap"/>
  <line x1="100" y1="270" x2="880" y2="270" stroke="#607c94" stroke-width="5" stroke-dasharray="10 7"/>
  <circle cx="430" cy="320" r="45" class="bubble"/><circle cx="555" cy="292" r="25" class="bubble"/>
  <path d="M430 455 V370" class="heat"/><path d="M555 455 V325" class="heat"/>
  <text x="490" y="95" class="text">phase equilibrium sets saturation; interfaces set real rates</text>
  <text x="210" y="195" class="small">vapor</text><text x="210" y="360" class="small">liquid</text><text x="600" y="250" class="small">surface tension / wetting / nucleation barrier</text>
</svg>
