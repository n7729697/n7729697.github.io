<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Stochastic simulation workflow</title>
  <desc id="desc">Gillespie-style stochastic simulation workflow with event rates and ensemble trajectories.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Stochastic Models Produce Distributions</text>
    <rect x="70" y="140" width="150" height="80" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="108" y="186" font-size="16">event rates</text>
    <rect x="290" y="140" width="150" height="80" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="325" y="174" font-size="16">sample time</text><text x="325" y="196" font-size="16">and event</text>
    <rect x="510" y="140" width="150" height="80" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="548" y="186" font-size="16">update state</text>
    <rect x="730" y="140" width="130" height="80" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="762" y="186" font-size="16">ensemble</text>
    <path d="M220 180 H290" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 180 H510" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M660 180 H730" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="205" y="315" font-size="15" fill="#5f625c">A single deterministic trajectory can hide extinction probabilities and rare-event behavior.</text>
  </g>
</svg>
