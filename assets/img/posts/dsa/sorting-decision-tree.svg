<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Sorting decision tree</title><desc id="desc">Sorting choice based on input size, key assumptions, stability, and memory.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:18px;fill:#26313a;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><rect x="390" y="55" width="200" height="70" rx="10" class="core"/><text x="490" y="97" class="text">sort input</text><rect x="110" y="210" width="190" height="70" rx="10" class="node"/><text x="205" y="252" class="text">nearly sorted?</text><rect x="395" y="210" width="190" height="70" rx="10" class="node"/><text x="490" y="252" class="text">general keys?</text><rect x="680" y="210" width="190" height="70" rx="10" class="node"/><text x="775" y="252" class="text">integer range?</text><rect x="110" y="365" width="190" height="70" rx="10" class="node"/><text x="205" y="407" class="text">insertion</text><rect x="395" y="365" width="190" height="70" rx="10" class="node"/><text x="490" y="407" class="text">merge / quick</text><rect x="680" y="365" width="190" height="70" rx="10" class="node"/><text x="775" y="407" class="text">counting / radix</text><path d="M450 125 L250 210" class="arrow"/><path d="M490 125 V210" class="arrow"/><path d="M530 125 L730 210" class="arrow"/><path d="M205 280 V365" class="arrow"/><path d="M490 280 V365" class="arrow"/><path d="M775 280 V365" class="arrow"/></svg>
