<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Processing structure property performance loop</title>
  <desc id="desc">Materials engineering loop connecting processing, structure, properties, performance, failure feedback, and characterization.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:21px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs>
  <rect width="980" height="560" fill="#f8f4ea"/>
  <rect x="90" y="100" width="180" height="80" rx="12" class="node"/><text x="180" y="134" class="text">processing</text><text x="180" y="158" class="small">heat, deformation, chemistry</text>
  <rect x="400" y="80" width="180" height="80" rx="12" class="node"/><text x="490" y="114" class="text">structure</text><text x="490" y="138" class="small">phases, grains, defects</text>
  <rect x="710" y="100" width="180" height="80" rx="12" class="node"/><text x="800" y="134" class="text">properties</text><text x="800" y="158" class="small">strength, conductivity</text>
  <rect x="620" y="365" width="190" height="80" rx="12" class="core"/><text x="715" y="399" class="text">performance</text><text x="715" y="423" class="small">service behavior</text>
  <rect x="170" y="365" width="190" height="80" rx="12" class="core"/><text x="265" y="399" class="text">failure feedback</text><text x="265" y="423" class="small">inspect and revise</text>
  <path d="M270 140 H400" class="arrow"/><path d="M580 140 H710" class="arrow"/><path d="M800 180 C820 245 790 315 740 365" class="arrow"/><path d="M620 405 H360" class="arrow"/><path d="M250 365 C190 300 155 230 175 180" class="arrow"/>
</svg>
