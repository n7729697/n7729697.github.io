<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Nutrunner drive-train model</title>
  <desc id="desc">Motor inertia, two-stage planetary gear with stiffness and damping, output shaft and nut inertia, and screw joint stiffness and damping, with the angles and torques used in the MF2030 model.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="980" height="430" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Nutrunner model (MF2030): motor → gear → nut → joint</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>4th-order rundown model; clamping adds the joint torque–angle stiffness</tspan></text>
    <rect x="30" y="140" width="150" height="90" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="105.0" y="172.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>BLDC motor</tspan></text>
    <text x="105.0" y="189.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>J</tspan><tspan dy="3.6" font-size="9">r</tspan><tspan dy="-3.6">,  k</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6">,  R</tspan></text>
    <text x="105.0" y="206.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>angle θ</tspan><tspan dy="3.6" font-size="9">1</tspan></text>
    <rect x="230" y="140" width="170" height="90" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="315.0" y="172.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>2 planetary stages</tspan></text>
    <text x="315.0" y="189.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>n = 81 (9 × 9)</tspan></text>
    <text x="315.0" y="206.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>J</tspan><tspan dy="3.6" font-size="9">g1</tspan><tspan dy="-3.6">, J</tspan><tspan dy="3.6" font-size="9">g2</tspan></text>
    <path d="M 400 185 l 15 -18 l 15 36 l 15 -36 l 15 36 l 15 -36 l 15 18" stroke="#263230" stroke-width="2" fill="none"/>
    <text x="445" y="118" font-size="12" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>K</tspan><tspan dy="3.4" font-size="8">t</tspan><tspan dy="-3.4"> = 739 N·m/rad</tspan></text>
    <text x="445" y="265" font-size="12" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>d</tspan><tspan dy="3.4" font-size="8">t</tspan><tspan dy="-3.4"> = 1.5 N·m·s/rad</tspan></text>
    <rect x="490" y="140" width="150" height="90" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="565.0" y="172.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>output shaft</tspan></text>
    <text x="565.0" y="189.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>+ angle head</tspan></text>
    <text x="565.0" y="206.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>J</tspan><tspan dy="3.6" font-size="9">o</tspan><tspan dy="-3.6">,  angle θ</tspan><tspan dy="3.6" font-size="9">2</tspan></text>
    <path d="M 640 185 l 15 -18 l 15 36 l 15 -36 l 15 36 l 15 18" stroke="#263230" stroke-width="2" fill="none"/>
    <text x="680" y="118" font-size="12" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>joint stiffness</tspan></text>
    <rect x="720" y="140" width="150" height="90" rx="8" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/>
    <text x="795.0" y="172.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>nut / screw /</tspan></text>
    <text x="795.0" y="189.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>clamped parts</tspan></text>
    <text x="795.0" y="206.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>d</tspan><tspan dy="3.6" font-size="9">j</tspan><tspan dy="-3.6"> (sky-hook)</tspan></text>
    <line x1="905" y1="120" x2="905" y2="250" stroke="#6f6a5f" stroke-width="6"/>
    <text x="915" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>fixed</tspan></text>
    <text x="915" y="206" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>bolt head</tspan></text>
    <line x1="870" y1="185" x2="902" y2="185" stroke="#263230" stroke-width="2"/>
    <line x1="105" y1="275" x2="105" y2="245" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="105" y="295" font-size="13" text-anchor="middle" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>V → i → τ</tspan><tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6"> = k</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> i</tspan></text>
    <text x="30" y="340" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>J</tspan><tspan dy="3.6" font-size="9">i</tspan><tspan dy="-3.6"> θ̈</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6"> = τ</tspan><tspan dy="3.6" font-size="9">m</tspan><tspan dy="-3.6"> − K</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> (θ</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6">/n² − θ</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">/n) − d</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> (θ̇</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6">/n² − θ̇</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">/n),       J</tspan><tspan dy="3.6" font-size="9">i</tspan><tspan dy="-3.6"> = J</tspan><tspan dy="3.6" font-size="9">r</tspan><tspan dy="-3.6"> + J</tspan><tspan dy="3.6" font-size="9">si</tspan><tspan dy="-3.6"> + J</tspan><tspan dy="3.6" font-size="9">g1</tspan><tspan dy="-3.6"> + J</tspan><tspan dy="3.6" font-size="9">g2</tspan><tspan dy="-3.6">/n</tspan></text>
    <text x="30" y="365" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>J</tspan><tspan dy="3.6" font-size="9">o</tspan><tspan dy="-3.6"> θ̈</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6"> = K</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> (θ</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6">/n − θ</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">) + d</tspan><tspan dy="3.6" font-size="9">t</tspan><tspan dy="-3.6"> (θ̇</tspan><tspan dy="3.6" font-size="9">1</tspan><tspan dy="-3.6">/n − θ̇</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">) − d</tspan><tspan dy="3.6" font-size="9">j</tspan><tspan dy="-3.6"> θ̇</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6"> − T</tspan><tspan dy="3.6" font-size="9">joint</tspan><tspan dy="-3.6">(θ</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">)</tspan></text>
    <text x="30" y="395" font-size="13" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>rundown: T</tspan><tspan dy="3.6" font-size="9">joint</tspan><tspan dy="-3.6"> = 0      clamping (report): T</tspan><tspan dy="3.6" font-size="9">joint</tspan><tspan dy="-3.6"> = k</tspan><tspan dy="3.6" font-size="9">rs</tspan><tspan dy="-3.6"> θ</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6"> = 3.04 θ</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6">      with thread + head friction: ≈ 32.6 θ</tspan><tspan dy="3.6" font-size="9">2</tspan><tspan dy="-3.6"> N·m/rad</tspan></text>
  </g>
</svg>
