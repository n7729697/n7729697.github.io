<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Stability bifurcation phase tools</title>
  <desc id="desc">Phase line, phase plane nullclines, and bifurcation diagram as biological modeling tools.</desc>
  <rect width="920" height="420" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Stability Tools Translate Equations into Biology</text>
    <line x1="90" y1="180" x2="310" y2="180" stroke="#4c5854" stroke-width="2"/><circle cx="200" cy="180" r="9" fill="#4e6f52"/><text x="145" y="220" font-size="15">phase line</text>
    <rect x="385" y="105" width="190" height="170" fill="#fbf8f0" stroke="#4c5854" stroke-width="2"/>
    <path d="M400 235 C450 160 510 160 560 235" fill="none" stroke="#426a7a" stroke-width="3"/>
    <path d="M410 125 C460 200 520 200 560 125" fill="none" stroke="#8b5849" stroke-width="3"/>
    <text x="430" y="305" font-size="15">nullclines</text>
    <line x1="650" y1="275" x2="830" y2="275" stroke="#4c5854"/><line x1="670" y1="295" x2="670" y2="105" stroke="#4c5854"/>
    <path d="M680 245 C725 235 750 210 775 150" fill="none" stroke="#4e6f52" stroke-width="3"/>
    <path d="M775 150 C795 190 815 235 825 260" fill="none" stroke="#8b5849" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="690" y="305" font-size="15">bifurcation</text>
  </g>
</svg>
