<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Consensus and Laplacian modes</title>
  <desc id="desc">Network agents and modal decomposition into average and disagreement modes.</desc>
  <rect width="920" height="420" fill="#f8f5ed"/>
  <g font-family="Georgia, serif" fill="#25312f">
    <text x="50" y="56" font-size="26" font-weight="700">Consensus = Average Mode + Decaying Disagreement</text>
    <g stroke="#5b6f62" stroke-width="3">
      <line x1="150" y1="155" x2="250" y2="115"/><line x1="250" y1="115" x2="335" y2="180"/><line x1="150" y1="155" x2="200" y2="260"/><line x1="200" y1="260" x2="335" y2="180"/><line x1="250" y1="115" x2="200" y2="260"/>
    </g>
    <g fill="#3d6657"><circle cx="150" cy="155" r="22"/><circle cx="250" cy="115" r="22"/><circle cx="335" cy="180" r="22"/><circle cx="200" cy="260" r="22"/></g>
    <text x="132" y="160" fill="white" font-size="14">1</text><text x="242" y="120" fill="white" font-size="14">2</text><text x="327" y="185" fill="white" font-size="14">3</text><text x="192" y="265" fill="white" font-size="14">4</text>
    <path d="M420 205 H500" stroke="#4c5854" stroke-width="3" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4c5854"/></marker></defs>
    <rect x="535" y="115" width="270" height="175" rx="18" fill="#e5dfef" stroke="#63537a" stroke-width="2"/>
    <text x="590" y="158" font-size="18">x = average + disagreement</text>
    <text x="575" y="200" font-size="18">lambda1 = 0 keeps average</text>
    <text x="575" y="235" font-size="18">lambda2...n &gt; 0 decay</text>
    <text x="105" y="335" font-size="15">Graph connectivity decides which disagreement modes can be removed.</text>
  </g>
</svg>
