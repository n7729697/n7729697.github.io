<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Three-phase inverter and six-step commutation</title>
  <desc id="desc">Three half-bridge legs feed a star-connected motor; the table lists the six commutation steps of trapezoidal BLDC control: one high-side and one low-side switch conduct, the third phase floats.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="1000" height="470" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Three-phase inverter and six-step commutation</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>each step energizes two phases; the floating phase is where sensorless control reads back-EMF</tspan></text>
    <line x1="60" y1="110" x2="440" y2="110" stroke="#263230" stroke-width="2.5"/>
    <line x1="60" y1="360" x2="440" y2="360" stroke="#263230" stroke-width="2.5"/>
    <text x="30" y="115" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>+V</tspan></text>
    <text x="30" y="365" font-size="13" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>0</tspan></text>
    <rect x="86" y="130" width="48" height="46" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="110.0" y="157.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>A+</tspan></text>
    <rect x="86" y="294" width="48" height="46" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="110.0" y="321.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>A−</tspan></text>
