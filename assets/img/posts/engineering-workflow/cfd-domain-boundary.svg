<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">CFD domain and boundary conditions</title><desc id="desc">Fluid domain around a body with inlet, outlet, wall, far field, mesh, and boundary conditions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.domain{fill:#d8e4ef;stroke:#607c94;stroke-width:3}.body{fill:#fff7e8;stroke:#b89057;stroke-width:3}.flow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.mesh{stroke:#8fa7b8;stroke-width:1.5}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><rect x="110" y="120" width="760" height="280" rx="16" class="domain"/><ellipse cx="490" cy="260" rx="110" ry="55" class="body"/><path d="M150 210 H360" class="flow"/><path d="M150 260 H350" class="flow"/><path d="M150 310 H360" class="flow"/><path d="M610 260 H835" class="flow"/><g opacity=".45"><line x1="250" y1="120" x2="250" y2="400" class="mesh"/><line x1="390" y1="120" x2="390" y2="400" class="mesh"/><line x1="590" y1="120" x2="590" y2="400" class="mesh"/><line x1="730" y1="120" x2="730" y2="400" class="mesh"/><line x1="110" y1="200" x2="870" y2="200" class="mesh"/><line x1="110" y1="320" x2="870" y2="320" class="mesh"/></g><text x="160" y="105" class="small">inlet</text><text x="825" y="105" class="small">outlet / far field</text><text x="490" y="455" class="small">CFD solves the fluid domain; boundary-condition realism is usually more important than plot smoothness.</text></svg>
