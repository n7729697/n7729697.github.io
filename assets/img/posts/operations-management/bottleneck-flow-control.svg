<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Bottleneck flow control</title><desc id="desc">Production line with bottleneck station controlling throughput and WIP release.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.bn{fill:#f1d8cc;stroke:#b45d47;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:19px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="500" fill="#f8f4ea"/><rect x="90" y="210" width="130" height="70" rx="10" class="node"/><text x="155" y="252" class="text">WS1</text><rect x="300" y="210" width="130" height="70" rx="10" class="bn"/><text x="365" y="252" class="text">bottleneck</text><rect x="510" y="210" width="130" height="70" rx="10" class="node"/><text x="575" y="252" class="text">WS3</text><rect x="720" y="210" width="130" height="70" rx="10" class="node"/><text x="785" y="252" class="text">ship</text><path d="M220 245 H300" class="arrow"/><path d="M430 245 H510" class="arrow"/><path d="M640 245 H720" class="arrow"/><path d="M365 280 V350 H120 V280" class="arrow"/><text x="250" y="385" class="small">release should protect bottleneck, not flood the line</text></svg>
