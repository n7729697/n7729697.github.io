<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">SIR and SIRS compartments</title>
  <desc id="desc">Susceptible, infected, and recovered compartments with infection, recovery, and waning immunity.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Compartment Models Are Stock-and-Flow Models</text>
    <circle cx="210" cy="205" r="60" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="197" y="213" font-size="25">S</text>
    <circle cx="460" cy="205" r="60" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="452" y="213" font-size="25">I</text>
    <circle cx="710" cy="205" r="60" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="701" y="213" font-size="25">R</text>
    <path d="M270 205 H400" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 205 H650" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690 263 C570 340 330 340 230 263" fill="none" stroke="#806632" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
    <text x="315" y="190" font-size="15">infection</text><text x="565" y="190" font-size="15">recovery</text><text x="405" y="355" font-size="15">waning immunity in SIRS</text>
  </g>
</svg>
