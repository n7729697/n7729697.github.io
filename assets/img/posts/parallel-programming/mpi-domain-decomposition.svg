<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">MPI domain decomposition</title>
  <desc id="desc">Distributed grid partitions with halo exchanges and collective reduction.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">MPI: Make Communication Structured</text>
    <rect x="120" y="120" width="360" height="220" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <line x1="300" y1="120" x2="300" y2="340" stroke="#426a7a" stroke-width="2"/><line x1="120" y1="230" x2="480" y2="230" stroke="#426a7a" stroke-width="2"/>
    <rect x="290" y="120" width="20" height="220" fill="#ead0c8" opacity=".7"/><rect x="120" y="220" width="360" height="20" fill="#ead0c8" opacity=".7"/>
    <text x="180" y="175" font-size="16">rank 0</text><text x="360" y="175" font-size="16">rank 1</text><text x="180" y="285" font-size="16">rank 2</text><text x="360" y="285" font-size="16">rank 3</text>
    <rect x="620" y="165" width="170" height="95" rx="16" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="660" y="205" font-size="17">collective</text><text x="655" y="230" font-size="15">reduce / allreduce</text>
    <text x="170" y="375" font-size="15" fill="#5f625c">Halo exchange handles neighbor data; collectives handle global summaries.</text>
  </g>
</svg>
