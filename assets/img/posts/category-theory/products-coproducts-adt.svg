<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Products, coproducts, and ADTs</title>
  <desc id="desc">Products as records and coproducts as tagged alternatives combine into algebraic data types.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">ADTs = Products and Coproducts</text>
    <rect x="90" y="125" width="270" height="180" rx="18" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="170" y="162" font-size="22">Product</text><text x="130" y="210" font-size="17">(name, age)</text><text x="130" y="245" font-size="17">both fields are present</text>
    <rect x="545" y="125" width="270" height="180" rx="18" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/>
    <text x="620" y="162" font-size="22">Coproduct</text><text x="585" y="210" font-size="17">Left a | Right b</text><text x="585" y="245" font-size="17">one tagged alternative</text>
    <text x="292" y="358" font-size="17">Data models become clearer when fields and alternatives are separated.</text>
  </g>
</svg>
