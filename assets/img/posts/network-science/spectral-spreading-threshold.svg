<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Spectral spreading threshold</title>
  <desc id="desc">SIS threshold depends on beta over delta crossing one over leading eigenvalue.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">SIS Threshold from Topology</text>
    <line x1="100" y1="310" x2="805" y2="310" stroke="#4c5854" stroke-width="2"/>
    <line x1="125" y1="80" x2="125" y2="330" stroke="#4c5854" stroke-width="2"/>
    <line x1="155" y1="235" x2="760" y2="235" stroke="#8b5849" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M145 300 C260 290 350 255 450 210 C555 165 640 132 760 112" fill="none" stroke="#426a7a" stroke-width="5"/>
    <text x="165" y="226" font-size="16">threshold = 1 / lambda1(A)</text>
    <text x="675" y="105" font-size="16">endemic growth</text>
    <text x="170" y="296" font-size="16">dies out</text>
    <text x="732" y="340" font-size="14">beta / delta</text>
    <text x="45" y="95" font-size="14">growth</text>
  </g>
</svg>
