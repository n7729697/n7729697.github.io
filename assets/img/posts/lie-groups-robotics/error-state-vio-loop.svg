<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Error-state visual-inertial filtering loop</title>
  <desc id="desc">A flow diagram showing IMU prediction, camera feature update, tangent-space error correction, and nominal-state reset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#273043"/>
    </marker>
    <style>
      .bg{fill:#f5f1e8}
      .box{fill:#fff;stroke:#273043;stroke-width:2}
      .accent{fill:#e8f4f8;stroke:#2b7a78;stroke-width:2}
      .warn{fill:#fff3e8;stroke:#c44536;stroke-width:2}
      .arrow{stroke:#273043;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Georgia,serif;fill:#273043;font-size:22px}
      .small{font-family:Georgia,serif;fill:#273043;font-size:17px}
      .eq{font-family:Georgia,serif;fill:#273043;font-size:18px;font-style:italic}
    </style>
  </defs>
  <rect class="bg" width="960" height="460"/>
  <rect class="box" x="60" y="82" width="190" height="100" rx="18"/>
  <text class="txt" x="96" y="122">IMU input</text>
  <text class="small" x="88" y="154">gyro, accel</text>
  <rect class="accent" x="330" y="70" width="250" height="124" rx="18"/>
  <text class="txt" x="376" y="112">Nominal state</text>
  <text class="eq" x="370" y="146">x = {p, v, q, bg, ba, g}</text>
  <text class="small" x="376" y="172">pose stays on manifold</text>
  <rect class="box" x="680" y="82" width="220" height="100" rx="18"/>
  <text class="txt" x="716" y="122">Camera update</text>
  <text class="small" x="714" y="154">features, reprojection</text>
  <rect class="warn" x="365" y="284" width="300" height="116" rx="18"/>
  <text class="txt" x="410" y="326">Tangent error</text>
  <text class="eq" x="402" y="360">delta x = [dp, dv, dtheta, dbg, dba]</text>
  <text class="small" x="430" y="386">covariance lives here</text>
  <path class="arrow" d="M 250 132 L 330 132"/>
  <path class="arrow" d="M 580 132 L 680 132"/>
  <path class="arrow" d="M 790 182 C 790 270, 710 330, 665 340"/>
  <path class="arrow" d="M 365 340 C 250 330, 180 250, 180 183"/>
  <path class="arrow" d="M 515 284 L 515 194"/>
  <text class="small" x="292" y="110">prediction</text>
  <text class="small" x="606" y="110">projection residual</text>
  <text class="small" x="686" y="286">innovation in local coords</text>
  <text class="small" x="232" y="286">reset after injection</text>
  <text class="small" x="532" y="246">q+ = q otimes deltaq</text>
</svg>
