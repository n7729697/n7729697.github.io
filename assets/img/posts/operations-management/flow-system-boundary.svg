<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Operations flow system boundary</title><desc id="desc">Operations system showing arrivals, queue, workstation, departures, WIP, throughput, cycle time, and feedback control.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.box{fill:#fff7e8;stroke:#b89057;stroke-width:3}.sys{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="500" fill="#f8f4ea"/><rect x="210" y="120" width="560" height="220" rx="18" class="sys"/><text x="490" y="105" class="text">system boundary</text><rect x="260" y="200" width="130" height="70" rx="10" class="box"/><text x="325" y="242" class="text">queue</text><rect x="520" y="200" width="150" height="70" rx="10" class="box"/><text x="595" y="242" class="text">workstation</text><path d="M70 235 H210" class="arrow"/><path d="M390 235 H520" class="arrow"/><path d="M670 235 H900" class="arrow"/><text x="115" y="210" class="small">arrivals</text><text x="840" y="210" class="small">departures TH</text><text x="490" y="305" class="small">WIP inside boundary, CT from entry to exit</text></svg>
