<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Boundary layer separation</title><desc id="desc">Boundary layer grows over a wall and separates under adverse pressure gradient.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.wall{stroke:#5d5142;stroke-width:8}.flow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.bl{stroke:#b45d47;stroke-width:5;fill:none}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><line x1="100" y1="360" x2="880" y2="360" class="wall"/><path d="M120 325 C300 290 520 250 760 185" class="bl"/><path d="M120 190 H800" class="flow"/><path d="M120 240 H560" class="flow"/><path d="M640 300 C710 270 780 290 835 325" class="flow"/><path d="M600 340 C670 380 760 385 835 360" class="flow"/><text x="285" y="400" class="small">viscous boundary layer</text><text x="705" y="145" class="small">adverse pressure gradient</text><text x="760" y="410" class="small">separation / wake</text></svg>
