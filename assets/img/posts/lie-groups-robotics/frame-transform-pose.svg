<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Frame transform pose</title>
  <desc id="desc">Two coordinate frames and a point related by rotation and translation.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <g font-family="Georgia, serif" fill="#263230" stroke-linecap="round">
    <text x="50" y="58" font-size="26" font-weight="700" stroke="none">Pose Relates Coordinate Frames</text>
    <line x1="180" y1="300" x2="330" y2="300" stroke="#4e6f52" stroke-width="4"/><line x1="180" y1="300" x2="180" y2="150" stroke="#4e6f52" stroke-width="4"/>
    <text x="335" y="305" font-size="15" stroke="none">world x</text><text x="145" y="145" font-size="15" stroke="none">world y</text>
    <line x1="570" y1="270" x2="700" y2="220" stroke="#426a7a" stroke-width="4"/><line x1="570" y1="270" x2="520" y2="140" stroke="#426a7a" stroke-width="4"/>
    <text x="705" y="220" font-size="15" stroke="none">body x</text><text x="485" y="135" font-size="15" stroke="none">body y</text>
    <circle cx="640" cy="145" r="10" fill="#8b5849" stroke="none"/><text x="655" y="150" font-size="16" stroke="none">p</text>
    <path d="M180 300 C290 230 430 235 570 270" fill="none" stroke="#806632" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="330" y="250" font-size="17" stroke="none">T = [R, t]</text>
  </g>
</svg>
