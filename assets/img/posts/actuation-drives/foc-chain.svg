<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Field-oriented control signal chain</title>
  <desc id="desc">Phase currents are measured, transformed by Clarke and Park into d-q currents, regulated by two PI controllers, transformed back by inverse Park, converted to switch timings by SVPWM and applied by the inverter to the motor; the rotor angle comes from the encoder.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="1000" height="400" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Field-oriented control: the current loop in rotor coordinates</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>everything inside the dashed box runs in the PWM-synchronous interrupt, typically 10–20 kHz</tspan></text>
    <rect x="150" y="90" width="690" height="200" rx="10" fill="none" stroke="#6f6a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="30" y="120" width="100" height="50" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="80.0" y="141.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>speed loop</tspan></text>
    <text x="80.0" y="157.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>(PI)</tspan></text>
    <rect x="170" y="105" width="95" height="40" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="217.5" y="129.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.4" font-size="8">d*</tspan><tspan dy="-3.4"> = 0</tspan></text>
    <rect x="170" y="150" width="95" height="40" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="217.5" y="174.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.4" font-size="8">q*</tspan><tspan dy="-3.4"> = T*/k</tspan></text>
    <line x1="130" y1="145" x2="170" y2="170" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="300" y="105" width="80" height="40" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="340.0" y="129.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>PI</tspan><tspan dy="3.6" font-size="9">d</tspan></text>
    <rect x="300" y="150" width="80" height="40" rx="8" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="340.0" y="174.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>PI</tspan><tspan dy="3.6" font-size="9">q</tspan></text>
    <line x1="265" y1="125" x2="300" y2="125" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="265" y1="170" x2="300" y2="170" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="410" y="120" width="100" height="55" rx="8" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="460.0" y="143.7" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>decoupling</tspan></text>
    <text x="460.0" y="159.7" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>+ inverse Park</tspan></text>
    <line x1="380" y1="125" x2="410" y2="135" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="380" y1="170" x2="410" y2="160" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="540" y="120" width="90" height="55" rx="8" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="585.0" y="152.05" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>SVPWM</tspan></text>
    <line x1="510" y1="147" x2="540" y2="147" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <text x="525.0" y="137.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>v</tspan><tspan dy="3.1" font-size="7">α</tspan><tspan dy="-3.1">, v</tspan><tspan dy="3.1" font-size="7">β</tspan></text>
    <rect x="660" y="120" width="90" height="55" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="705.0" y="143.7" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>3 duty</tspan></text>
    <text x="705.0" y="159.7" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>registers</tspan></text>
    <line x1="630" y1="147" x2="660" y2="147" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="790" y="120" width="90" height="55" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="835.0" y="152.05" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>inverter</tspan></text>
    <line x1="750" y1="147" x2="790" y2="147" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="900" y="120" width="80" height="55" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="940.0" y="152.05" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>PMSM</tspan></text>
    <line x1="880" y1="147" x2="900" y2="147" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="660" y="220" width="90" height="50" rx="8" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="705.0" y="241.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>Clarke</tspan></text>
    <text x="705.0" y="257.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>+ Park</tspan></text>
    <rect x="790" y="220" width="90" height="50" rx="8" fill="#e6e1d6" stroke="#6f6a5f" stroke-width="2"/>
    <text x="835.0" y="241.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>ADC</tspan></text>
    <text x="835.0" y="257.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.4" font-size="8">a</tspan><tspan dy="-3.4">, i</tspan><tspan dy="3.4" font-size="8">b</tspan></text>
    <line x1="940" y1="175" x2="940" y2="245" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="940" y1="245" x2="880" y2="245" stroke="#263230" stroke-width="2"/>
    <line x1="790" y1="245" x2="750" y2="245" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <path d="M 660 245 L 340 245 L 340 190" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="500" y="238" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>i</tspan><tspan dy="3.4" font-size="8">d</tspan><tspan dy="-3.4">, i</tspan><tspan dy="3.4" font-size="8">q</tspan></text>
    <rect x="900" y="320" width="80" height="45" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="940.0" y="346.7" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>encoder</tspan></text>
    <line x1="940" y1="175" x2="940" y2="320" stroke="#263230" stroke-width="2" marker-end="url(#ah)"/>
    <path d="M 900 342 L 460 342 L 460 175" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="560" y="335" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>θ</tspan><tspan dy="3.4" font-size="8">e</tspan><tspan dy="-3.4"> = p θ</tspan><tspan dy="3.4" font-size="8">m</tspan><tspan dy="-3.4"> (Park angles)</tspan></text>
    <path d="M 900 355 L 80 355 L 80 170" stroke="#263230" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="200" y="350" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>ω</tspan></text>
  </g>
</svg>
