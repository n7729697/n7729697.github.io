<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Link analysis with random walks</title>
  <desc id="desc">Directed graph showing PageRank teleportation and HITS hub-authority flow.</desc>
  <rect width="920" height="420" fill="#f8f5ed"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4c5854"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Ranking from Graph Flow</text>
    <g stroke="#4c5854" stroke-width="3" marker-end="url(#arrow)">
      <path d="M170 155 L280 110"/><path d="M280 110 L380 178"/><path d="M170 155 L245 255"/><path d="M245 255 L380 178"/><path d="M380 178 L280 110"/>
    </g>
    <g fill="#d8e8ef" stroke="#426a7a" stroke-width="2"><circle cx="170" cy="155" r="25"/><circle cx="280" cy="110" r="25"/><circle cx="380" cy="178" r="25"/><circle cx="245" cy="255" r="25"/></g>
    <path d="M118 300 C90 190 125 95 230 85" fill="none" stroke="#9b5847" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="74" y="335" font-size="15">PageRank teleportation prevents traps</text>
    <rect x="540" y="115" width="260" height="165" rx="16" fill="#e8dfef" stroke="#64527b" stroke-width="2"/>
    <text x="590" y="158" font-size="19">HITS roles</text>
    <text x="580" y="195" font-size="17">authority a proportional A^T h</text>
    <text x="580" y="230" font-size="17">hub h proportional A a</text>
    <text x="540" y="322" font-size="15" fill="#5f625c">One score is not always enough; directed graphs can encode different roles.</text>
  </g>
</svg>
