<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Nozzle shock map</title><desc id="desc">Converging diverging nozzle showing choking, supersonic expansion, and shock location.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.noz{fill:#fff7e8;stroke:#b89057;stroke-width:4}.flow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.shock{stroke:#b45d47;stroke-width:7}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="520" fill="#f8f4ea"/><path d="M130 160 C330 210 430 230 500 230 C570 230 690 200 850 150 L850 360 C690 310 570 290 500 290 C430 290 330 310 130 360 Z" class="noz"/><path d="M170 260 H810" class="flow"/><line x1="500" y1="215" x2="500" y2="305" stroke="#5f7c57" stroke-width="5"/><line x1="675" y1="190" x2="675" y2="330" class="shock"/><text x="500" y="190" class="small">throat Ma=1 if choked</text><text x="680" y="170" class="small">normal shock possible</text><text x="275" y="420" class="small">subsonic acceleration</text><text x="700" y="420" class="small">supersonic expansion if pressure ratio supports it</text></svg>
