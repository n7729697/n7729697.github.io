<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Exposure dose pathway</title>
  <desc id="desc">Exposure pathway from source strength through transport, concentration, duration, uptake, dose, susceptibility, and health effect.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.person{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:19px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:14px;fill:#3b4750;text-anchor:middle}</style></defs>
  <rect width="980" height="520" fill="#f8f4ea"/>
  <rect x="45" y="210" width="120" height="80" rx="12" class="node"/><text x="105" y="242" class="text">source</text><text x="105" y="266" class="small">emission</text>
  <rect x="210" y="210" width="120" height="80" rx="12" class="node"/><text x="270" y="242" class="text">transport</text><text x="270" y="266" class="small">air/water/contact</text>
  <rect x="375" y="210" width="120" height="80" rx="12" class="node"/><text x="435" y="242" class="text">C(t)</text><text x="435" y="266" class="small">concentration</text>
  <rect x="540" y="210" width="120" height="80" rx="12" class="node"/><text x="600" y="242" class="text">duration</text><text x="600" y="266" class="small">time exposed</text>
  <rect x="705" y="210" width="120" height="80" rx="12" class="person"/><text x="765" y="242" class="text">dose</text><text x="765" y="266" class="small">uptake</text>
  <rect x="840" y="330" width="110" height="70" rx="12" class="person"/><text x="895" y="358" class="text">effect</text><text x="895" y="382" class="small">health</text>
  <path d="M165 250 H210" class="arrow"/><path d="M330 250 H375" class="arrow"/><path d="M495 250 H540" class="arrow"/><path d="M660 250 H705" class="arrow"/><path d="M815 278 C850 300 870 320 885 330" class="arrow"/>
  <text x="490" y="110" class="text">Exposure integrates concentration over time: E = ∫ C(t) dt</text>
  <text x="760" y="405" class="small">susceptibility changes response</text>
</svg>
