<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Device model hierarchy</title>
  <desc id="desc">Hierarchy from ideal devices to nonlinear, small-signal, parasitic, and thermal models.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Choose the Model for the Question</text>
    <g font-size="16">
      <rect x="55" y="145" width="140" height="80" rx="14" fill="#eee2b7" stroke="#806632" stroke-width="2"/><text x="95" y="178">ideal</text><text x="80" y="202">switch/gain</text>
      <rect x="245" y="145" width="140" height="80" rx="14" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/><text x="278" y="178">large signal</text><text x="278" y="202">bias, regions</text>
      <rect x="435" y="145" width="140" height="80" rx="14" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/><text x="463" y="178">small signal</text><text x="462" y="202">gain, noise</text>
      <rect x="625" y="145" width="140" height="80" rx="14" fill="#ead0c8" stroke="#8b5849" stroke-width="2"/><text x="658" y="178">parasitic</text><text x="648" y="202">layout, package</text>
    </g>
    <path d="M195 185 H245" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M385 185 H435" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/><path d="M575 185 H625" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M695 226 C615 320 300 320 125 226" fill="none" stroke="#405a58" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="170" y="330" font-size="15" fill="#5f625c">Start simple, then add exactly the non-idealities that can change the decision.</text>
  </g>
</svg>
