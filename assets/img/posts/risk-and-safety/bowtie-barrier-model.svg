<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Bow-tie barrier model</title>
  <desc id="desc">Bow-tie risk model with threats, preventive barriers, top event, mitigating barriers, and consequences.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.bar{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.event{fill:#f1d8cc;stroke:#b45d47;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:20px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:15px;fill:#3b4750;text-anchor:middle}</style></defs>
  <rect width="980" height="540" fill="#f8f4ea"/>
  <rect x="70" y="120" width="150" height="80" rx="12" class="node"/><text x="145" y="154" class="text">threats</text><text x="145" y="178" class="small">causes</text>
  <rect x="70" y="330" width="150" height="80" rx="12" class="node"/><text x="145" y="364" class="text">threats</text><text x="145" y="388" class="small">conditions</text>
  <rect x="300" y="145" width="120" height="70" rx="10" class="bar"/><text x="360" y="186" class="small">prevent</text>
  <rect x="300" y="305" width="120" height="70" rx="10" class="bar"/><text x="360" y="346" class="small">prevent</text>
  <circle cx="500" cy="260" r="55" class="event"/><text x="500" y="254" class="text">top</text><text x="500" y="280" class="text">event</text>
  <rect x="585" y="145" width="120" height="70" rx="10" class="bar"/><text x="645" y="186" class="small">mitigate</text>
  <rect x="585" y="305" width="120" height="70" rx="10" class="bar"/><text x="645" y="346" class="small">mitigate</text>
  <rect x="780" y="120" width="150" height="80" rx="12" class="event"/><text x="855" y="154" class="text">harm</text><text x="855" y="178" class="small">consequence</text>
  <rect x="780" y="330" width="150" height="80" rx="12" class="event"/><text x="855" y="364" class="text">harm</text><text x="855" y="388" class="small">loss</text>
  <path d="M220 160 H300" class="arrow"/><path d="M420 180 C450 200 465 225 475 245" class="arrow"/><path d="M220 370 H300" class="arrow"/><path d="M420 340 C450 320 465 295 475 275" class="arrow"/><path d="M555 245 C570 220 590 200 585 180" class="arrow"/><path d="M705 180 H780" class="arrow"/><path d="M555 275 C570 300 590 320 585 340" class="arrow"/><path d="M705 340 H780" class="arrow"/>
</svg>
