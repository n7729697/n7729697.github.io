<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Geometry to analysis pipeline</title><desc id="desc">Pipeline from intent to drawing, CAD, CAM, FEM, CFD, validation, and revised design.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#45545e"/></marker><style>.node{fill:#fff7e8;stroke:#b89057;stroke-width:3}.core{fill:#dcebdc;stroke:#5f7c57;stroke-width:3}.arrow{stroke:#45545e;stroke-width:4;fill:none;marker-end:url(#arrow)}.text{font-family:Georgia,serif;font-size:18px;fill:#26313a;text-anchor:middle}.small{font-family:Georgia,serif;font-size:14px;fill:#3b4750;text-anchor:middle}</style></defs><rect width="980" height="500" fill="#f8f4ea"/><g transform="translate(40,190)"><rect width="110" height="70" rx="10" class="node"/><text x="55" y="42" class="text">intent</text></g><g transform="translate(180,190)"><rect width="110" height="70" rx="10" class="node"/><text x="55" y="42" class="text">drawing</text></g><g transform="translate(320,190)"><rect width="110" height="70" rx="10" class="core"/><text x="55" y="42" class="text">CAD</text></g><g transform="translate(460,190)"><rect width="110" height="70" rx="10" class="node"/><text x="55" y="42" class="text">CAM</text></g><g transform="translate(600,145)"><rect width="110" height="70" rx="10" class="node"/><text x="55" y="42" class="text">FEM</text></g><g transform="translate(600,245)"><rect width="110" height="70" rx="10" class="node"/><text x="55" y="42" class="text">CFD</text></g><g transform="translate(760,190)"><rect width="140" height="70" rx="10" class="core"/><text x="70" y="42" class="text">validation</text></g><path d="M150 225 H180" class="arrow"/><path d="M290 225 H320" class="arrow"/><path d="M430 225 H460" class="arrow"/><path d="M570 210 L600 180" class="arrow"/><path d="M570 240 L600 280" class="arrow"/><path d="M710 180 L760 215" class="arrow"/><path d="M710 280 L760 235" class="arrow"/><path d="M830 190 C770 85 290 85 110 190" class="arrow"/><text x="490" y="390" class="small">Every handoff can lose intent: datums, tolerances, loads, constraints, process assumptions, or validation evidence.</text></svg>
