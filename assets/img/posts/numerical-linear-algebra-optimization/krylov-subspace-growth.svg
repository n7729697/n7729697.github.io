<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Krylov subspace growth</title>
  <desc id="desc">Residual repeatedly multiplied by A creates a growing Krylov subspace.</desc>
  <rect width="920" height="420" fill="#fbf8f0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#405a58"/></marker></defs>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="50" y="58" font-size="26" font-weight="700">Krylov Methods Grow Search Spaces Cheaply</text>
    <ellipse cx="455" cy="235" rx="310" ry="105" fill="#d8e8ef" stroke="#426a7a" stroke-width="2"/>
    <text x="260" y="190" font-size="18">r0</text><text x="365" y="160" font-size="18">A r0</text><text x="500" y="155" font-size="18">A^2 r0</text><text x="635" y="190" font-size="18">...</text>
    <path d="M275 210 L385 185 L520 180 L650 220" stroke="#8b5849" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="240" y="300" font-size="18">K_k(A,r0) = span{r0, A r0, ..., A^(k-1) r0}</text>
  </g>
</svg>
