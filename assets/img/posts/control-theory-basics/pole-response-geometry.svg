<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Pole geometry and response behavior</title>
  <desc id="desc">Complex plane showing stable, marginal, and unstable pole locations and their qualitative time responses.</desc>
  <style>
    .axis{stroke:#3f5663;stroke-width:3}
    .grid{stroke:#cdbb9c;stroke-width:1.5}
    .stable{stroke:#5f7c57;stroke-width:5}
    .unstable{stroke:#b45d47;stroke-width:5}
    .marginal{stroke:#bd8b32;stroke-width:5}
    .text{font-family:Georgia,serif;font-size:21px;fill:#26313a}
    .small{font-family:Georgia,serif;font-size:16px;fill:#3b4750}
  </style>
  <rect width="980" height="560" fill="#f8f4ea"/>
  <line x1="120" y1="280" x2="860" y2="280" class="axis"/>
  <line x1="490" y1="70" x2="490" y2="490" class="axis"/>
  <line x1="310" y1="70" x2="310" y2="490" class="grid"/>
  <line x1="670" y1="70" x2="670" y2="490" class="grid"/>
  <text x="835" y="308" class="small">Re(s)</text>
  <text x="505" y="92" class="small">Im(s)</text>
  <text x="210" y="95" class="text">left half-plane</text>
  <text x="650" y="95" class="text">right half-plane</text>
  <line x1="250" y1="280" x2="250" y2="280" class="stable"/>
  <line x1="355" y1="205" x2="355" y2="205" class="stable"/>
  <line x1="355" y1="355" x2="355" y2="355" class="stable"/>
  <line x1="490" y1="170" x2="490" y2="170" class="marginal"/>
  <line x1="490" y1="390" x2="490" y2="390" class="marginal"/>
  <line x1="690" y1="215" x2="690" y2="215" class="unstable"/>
  <line x1="690" y1="345" x2="690" y2="345" class="unstable"/>
  <text x="210" y="380" class="small">decay</text>
  <text x="300" y="425" class="small">decaying oscillation</text>
  <text x="520" y="185" class="small">marginal</text>
  <text x="720" y="390" class="small">growth</text>
  <text x="150" y="520" class="small">Farther left usually means faster decay. Larger imaginary part means faster oscillation.</text>
</svg>
