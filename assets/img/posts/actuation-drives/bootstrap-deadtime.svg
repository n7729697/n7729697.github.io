<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Half bridge with bootstrap gate supply and dead time</title>
  <desc id="desc">Half bridge with high-side and low-side N-channel MOSFETs, a bootstrap diode and capacitor that supply the floating high-side driver, and a timing diagram showing dead time between the gate signals and the switch-node voltage during the dead time.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263230"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462f"/></marker></defs>
  <rect width="1000" height="450" fill="#f8f4ec"/>
  <g font-family="Georgia, serif" fill="#263230">
    <text x="30" y="40" font-size="22" text-anchor="start" font-weight="700" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>Half bridge: bootstrap supply and dead time</tspan></text>
    <text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="#5d6a66" font-style="italic" xml:space="preserve" style="white-space:pre"><tspan>the high-side gate must sit V</tspan><tspan dy="3.9" font-size="10">GS</tspan><tspan dy="-3.9"> above a node that swings between 0 and V</tspan><tspan dy="3.9" font-size="10">bus</tspan></text>
    <line x1="120" y1="90" x2="120" y2="370" stroke="#263230" stroke-width="2.5"/>
    <text x="105" y="85" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>V</tspan><tspan dy="3.4" font-size="8">bus</tspan></text>
    <rect x="170" y="110" width="80" height="60" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="210.0" y="144.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>Q</tspan><tspan dy="3.6" font-size="9">H</tspan></text>
    <rect x="170" y="260" width="80" height="60" rx="8" fill="#d7e4ce" stroke="#4e6f52" stroke-width="2"/>
    <text x="210.0" y="294.55" font-size="13" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>Q</tspan><tspan dy="3.6" font-size="9">L</tspan></text>
    <line x1="120" y1="100" x2="210" y2="100" stroke="#263230" stroke-width="2"/>
    <line x1="210" y1="100" x2="210" y2="110" stroke="#263230" stroke-width="2"/>
    <line x1="210" y1="170" x2="210" y2="260" stroke="#263230" stroke-width="2"/>
    <line x1="210" y1="320" x2="210" y2="370" stroke="#263230" stroke-width="2"/>
    <line x1="120" y1="370" x2="330" y2="370" stroke="#263230" stroke-width="2"/>
    <text x="260" y="390" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>GND / shunt</tspan></text>
    <line x1="210" y1="215" x2="330" y2="215" stroke="#263230" stroke-width="2"/>
    <text x="335" y="232" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>to winding</tspan></text>
    <rect x="20" y="190" width="80" height="50" rx="8" fill="#e2d9ea" stroke="#6b4f7a" stroke-width="2"/>
    <text x="60.0" y="211.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>gate</tspan></text>
    <text x="60.0" y="227.2" font-size="12" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>driver</tspan></text>
    <line x1="100" y1="205" x2="170" y2="140" stroke="#263230" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="100" y1="225" x2="170" y2="290" stroke="#263230" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="60" y1="190" x2="60" y2="150" stroke="#263230" stroke-width="2"/>
    <rect x="35" y="120" width="50" height="30" rx="8" fill="#fbf9f4" stroke="#4c5854" stroke-width="2"/>
    <text x="60.0" y="138.85" font-size="11" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>D</tspan><tspan dy="3.1" font-size="7">BS</tspan></text>
    <line x1="60" y1="120" x2="60" y2="100" stroke="#263230" stroke-width="2"/>
    <text x="30" y="96" font-size="12" text-anchor="start" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>V</tspan><tspan dy="3.4" font-size="8">DD</tspan></text>
    <rect x="255" y="180" width="48" height="30" rx="8" fill="#eee2b7" stroke="#806632" stroke-width="2"/>
    <text x="279.0" y="198.85" font-size="11" text-anchor="middle" font-weight="normal" xml:space="preserve" style="white-space:pre"><tspan>C</tspan><tspan dy="3.1" font-size="7">BS</tspan></text>
    <line x1="279" y1="210" x2="279" y2="215" stroke="#263230" stroke-width="2"/>
    <text x="20" y="415" font-size="11" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>C</tspan><tspan dy="3.1" font-size="7">BS</tspan><tspan dy="-3.1"> recharges only while Q</tspan><tspan dy="3.1" font-size="7">L</tspan><tspan dy="-3.1"> is on, so the high side cannot stay on at 100 % duty</tspan></text>
    <text x="490" y="125" font-size="13" text-anchor="end" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>gate H</tspan></text>
    <path d="M 500 120 L 546 120 L 546 100 L 707 100 L 707 120 L 960 120" stroke="#426a7a" stroke-width="2" fill="none"/>
    <text x="490" y="215" font-size="13" text-anchor="end" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>gate L</tspan></text>
    <path d="M 500 190 L 523 190 L 523 210 L 730 210 L 730 190 L 960 190" stroke="#426a7a" stroke-width="2" fill="none"/>
    <text x="490" y="305" font-size="13" text-anchor="end" font-weight="normal" fill="#263230" xml:space="preserve" style="white-space:pre"><tspan>switch node</tspan></text>
    <rect x="523" y="85" width="23" height="230" fill="#ead0c8" opacity="0.6"/>
    <rect x="707" y="85" width="23" height="230" fill="#ead0c8" opacity="0.6"/>
    <path d="M 500 300 L 523 300 L 523 308 L 546 308 L 546 260 L 707 260 L 707 260 L 730 308 L 730 300 L 960 300" stroke="#b5462f" stroke-width="2" fill="none"/>
    <text x="534.5" y="80" font-size="11" text-anchor="middle" font-weight="normal" fill="#b5462f" xml:space="preserve" style="white-space:pre"><tspan>dead time</tspan></text>
    <text x="380" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>During dead time the body diode carries the current: the node sits at −V</tspan><tspan dy="3.4" font-size="8">F</tspan><tspan dy="-3.4"> or V</tspan><tspan dy="3.4" font-size="8">bus</tspan><tspan dy="-3.4"> + V</tspan><tspan dy="3.4" font-size="8">F</tspan></text>
    <text x="380" y="360" font-size="12" text-anchor="start" font-weight="normal" fill="#5d6a66" xml:space="preserve" style="white-space:pre"><tspan>depending on current direction  →  average-voltage error ≈ (t</tspan><tspan dy="3.4" font-size="8">dead</tspan><tspan dy="-3.4"> / T</tspan><tspan dy="3.4" font-size="8">s</tspan><tspan dy="-3.4">) · V</tspan><tspan dy="3.4" font-size="8">bus</tspan><tspan dy="-3.4"> · sign(i)</tspan></text>
  </g>
</svg>
